[[solve.examples]]
caption = "A bouncing ball's landing as a terminal event, located on the dense output."
code = '''import numpy as np
import vipyr as vp
r = vp.ode.solve("ball", (0.0, 10.0), [10.0, 0.0], method="dopri5", params=[9.81],
                 events="ball_hits", direction=[-1], terminal=[True])
print(r.message, r.t_events[0], np.sqrt(2 * 10.0 / 9.81))'''

[[solve.examples]]
caption = "Van der Pol with mu = 1000 (Hairer's scaled form, eps = 1e-6) by auto: it starts explicit and changes to Radau IIA."
code = '''import vipyr as vp
r = vp.ode.solve("vdpol", (0.0, 2.0), [2.0, 0.0], method="auto", rtol=1e-6, atol=1e-6, params=[1e-6])
print(r.y[:, -1], r.stiff_at is not None, r.stats)'''

[solve.params.rhs]
doc = "the right-hand side f(t, y, p), a Viv def: a problem of lib/ode/problems.viv by name, 'file.viv:def', a def of a module from vp.load, or a Python function py2viv translates"

[solve.params.params]
doc = "the parameter vector p every call of rhs, events and jac receives; one compiled solver serves every p"

[batch]
summary = "Solve one initial value problem for many parameter sets and initial states in one call."
description = """
The case SciPy's `solve_ivp` handles worst: thousands of small systems, one
per parameter set (a dose-response sweep, a posterior sample, an ensemble
of epidemics). A Python loop pays solve_ivp's per-call and per-step
overhead for each; `vp.ode.batch` runs the compiled solver over all the
rows in one call. Each row is an independent adaptive solve with its own
steps, reported on the common grid `t_eval`.
"""
notes = """
Row b of the result is exactly what `vp.ode.solve(rhs, t_span, y0[b],
params=params[b], t_eval=t_eval, ...)` returns, bit for bit: the batch is a
loop in Viv over the same solver, not a vectorized approximation.

The output is `y[b, i, j]`: solve b, component i, time `t_eval[j]`. A solve
stopped by a terminal event has NaN after it; `first_event[b]` is its first
event time. `status[b]` and the per-row `stats` say how each solve ended
and what it cost.
"""
see_also = ["ode.solve"]

[[batch.references]]
text = "E. Hairer and G. Wanner, Solving Ordinary Differential Equations II: Stiff and Differential-Algebraic Problems, 2nd ed., Springer (1996)."
doi = "10.1007/978-3-642-05221-7"

[[batch.references]]
text = "H. Bateman, The solution of a system of differential equations occurring in the theory of radio-active transformations, Proc. Cambridge Philos. Soc. 15, 423-427 (1910): the closed form the pharmacokinetic batch is checked against."

[batch.params.params]
doc = "one parameter vector per solve, shape (B, k): row b is the p of solve b"
