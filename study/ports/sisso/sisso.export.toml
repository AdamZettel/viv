# study/ports/sisso/sisso.export.toml -- the manifest of `viv export` for
# sisso.viv, the port of the SISSO Fortran (Apache-2.0, THIRD_PARTY.md).
#
#     viv export study/ports/sisso/sisso.export.toml -o dist/sisso
#
# python/vipyr/sisso.py loads it through vipyr and turns the results into
# formulas; tools/export/check.py holds the library, the native build and
# the interpreter to the same bits on the cases below.

name = "sisso"
about = "study/ports/sisso/sisso.viv"
files = ["study/ports/sisso/sisso.viv"]
cases = "study/ports/sisso/sisso.cases.json"

[params]
# primary features, one row per feature; samples along the second axis
x_data = { type = "Arr", rank = 2 }
y_data = { type = "Arr", rank = 1 }
# one row per primary feature: its exponent of each base unit
unit_exps = { type = "Arr", rank = 2 }
label_codes = { type = "[Int]", min = 1, max = 255 }
label_starts = { type = "[Int]", min = 0 }
op_codes = { type = "[Int]", min = 1, max = 17 }
# the Fortran's table goes to rung 4 (complexity 15)
fcomplexity_in = { type = "Int", min = 0, max = 15 }
desc_dim_in = { type = "Int", min = 1, max = 10 }
nf_sis_in = { type = "Int", min = 1 }
fmax_min = { type = "Num", min = 0.0 }
fmax_max = { type = "Num", min_exclusive = 0.0 }
max_values_in = { type = "Int", min = 1 }

[results]
# integer-valued results are Arr, exact: the export's report prints
# Arr results and not [Int] ones
PHI_SIZES = "Arr"
SIS_SIZES = "Arr"
NODE_OP = "Arr"
NODE_A = "Arr"
NODE_B = "Arr"
US_OP = "Arr"
US_A = "Arr"
US_B = "Arr"
US_SCORE = "Arr"
MODEL_IDX = "Arr"
MODEL_COEF = "Arr"
MODEL_C0 = "Arr"
MODEL_RMSE = "Arr"
MODEL_MAXAE = "Arr"

[reference]
program = "SISSO 3.5 (github.com/rouyang2017/SISSO), built with gfortran and run as one process by study/ports/sisso/compare_fortran.py"
compare = "the same Phi sizes, subspace (names in order), descriptors; coefficients, intercepts and RMSE to 1e-8 relative"
