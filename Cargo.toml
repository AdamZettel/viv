[workspace]
resolver = "2"
members = ["crates/knotkit", "lang/viv", "lang/oa", "lang/weft", "lang/skein"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
knotkit = { path = "crates/knotkit" }
# Pinned to the 1.5 line: newer blake3 pulls constant_time_eq 0.4, which
# requires Rust edition 2024 (unsupported by the toolchain here, cargo 1.77).
blake3 = "=1.5.5"
