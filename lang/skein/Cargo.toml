[package]
name = "skein"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Skein: a small teaching Scheme that compiles to C through knotkit."

[lib]
# rlib for the CLI/tests; cdylib so the crate compiles to a browser wasm module.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "skein"
path = "src/main.rs"

[dependencies]
knotkit.workspace = true
