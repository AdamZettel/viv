[package]
name = "viv"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Viv: a general-purpose numerical language built on knotkit."

[lib]
# rlib for the CLI/tests; cdylib so the crate compiles to a browser wasm module.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "viv"
path = "src/main.rs"

[dependencies]
knotkit.workspace = true
