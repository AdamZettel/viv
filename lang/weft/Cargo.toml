[package]
name = "weft"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Weft: a UFL-style weak-form DSL that compiles to Viv (a DSL-on-a-DSL on knotkit)."

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
knotkit.workspace = true
viv = { path = "../viv" }
