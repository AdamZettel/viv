# vipyr-NAME: a port of NAME (UPSTREAM.md) as a vipyr distribution.
[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-NAME"
version = "0.0.1"
description = "NAME, ported to Viv, for vipyr"
license = "the upstream license (LICENSE)"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
NAME = "vipyr_NAME"

[tool.vipyr]
packages = ["vipyr_NAME"]
