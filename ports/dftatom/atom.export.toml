# dftatom's self-consistent atom as one C file and a Python wrapper:
# `viv export ports/dftatom/atom.export.toml`.
# Paths are under the repository root. A parameter left out of a run keeps
# the program's value (iron, nonrelativistic, upstream's LDA test mesh with
# N = 6000); each parameter's meaning is the `#:` line above it in
# ports/dftatom/atom.viv.
#
# Upstream: https://github.com/certik/dftatom (MIT), Certik, Pask and
# Vackar, Comput. Phys. Commun. 184, 1777 (2013). The comparison with
# upstream's Fortran and with NIST is ports/dftatom/COMPARISON.md; the tests
# that hold the runs to it are ports/dftatom/test_dftatom.py.
name = "dftatom"
about = "ports/dftatom/atom.viv"
files = ["ports/dftatom/atom.viv"]
cases = "ports/dftatom/atom.cases.json"

[params]
z = { type = "Int", min = 1, max = 92 }
relativistic = { type = "Bool" }
r_min = { type = "Num", min_exclusive = 0.0 }
r_max = { type = "Num", min_exclusive = 0.0 }
a = { type = "Num", min_exclusive = 1.0 }
n = { type = "Int", min = 100, max = 1000000 }
c = { type = "Num", min_exclusive = 0.0 }
reigen_eps = { type = "Num", min_exclusive = 0.0 }
reigen_max_iter = { type = "Int", min = 1, max = 100000 }
mixing_eps = { type = "Num", min_exclusive = 0.0 }
mixing_alpha = { type = "Num", min_exclusive = 0.0, max = 1.0 }
mixing_max_iter = { type = "Int", min = 1, max = 100000 }
perturb = { type = "Bool" }

[results]
etot = "Num"
ekin = "Num"
ecoul = "Num"
eenuc = "Num"
exc = "Num"
orbital_n = "Arr"
orbital_l = "Arr"
orbital_kappa = "Arr"
occupation = "Arr"
orbital_energies = "Arr"
mesh = "Arr"
density = "Arr"
v_tot = "Arr"
charge = "Num"
scf_converged = "Bool"
scf_iterations = "Int"

[reference]
upstream = "dftatom, https://github.com/certik/dftatom at e49b3042, built with gfortran -O2 -fno-fast-math; its own tests (Z92n7all, lda, rlda) and the energies it reproduces"
nist = "NIST Standard Reference Database 141, Atomic Reference Data for Electronic Structure Calculations (Kotochigova, Levine, Shirley, Stiles and Clark, Phys. Rev. A 55, 191 (1997)), LDA and RLDA columns"
tests = "ports/dftatom/test_dftatom.py: every tolerance is stated beside its check"
