# vipyr-dftatom: a port of dftatom (Certik, Pask and Vackar; MIT; UPSTREAM.md)
# as a vipyr distribution, laid out as ports/_template on branch vipyr. In a
# checkout vipyr finds it through the entry point below (vipyr/_packages.py)
# and `vp.dftatom` is the module vipyr_dftatom.
[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-dftatom"
version = "0.0.1"
description = "dftatom's radial Schrodinger and Dirac solvers and LDA/RLDA atom, ported to Viv, for vipyr"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ondrej Certik" },
    { name = "John E. Pask" },
    { name = "Jiri Vackar" },
    { name = "Adam Zettel" },
]
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1", "numpy"]

[project.urls]
Upstream = "https://github.com/certik/dftatom"
Paper = "https://doi.org/10.1016/j.cpc.2013.02.014"

[project.entry-points."vipyr.packages"]
dftatom = "vipyr_dftatom"

[tool.vipyr]
packages = ["vipyr_dftatom"]
# the program compiled into the platform wheel (vipyr/_prebuilt.py)
prebuild = ["atom.viv"]
prebuild-extra = ["atom.cases.json"]
