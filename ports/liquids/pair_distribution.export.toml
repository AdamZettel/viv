# The pair distribution function g(r) of a set of configurations as one C file and a Python wrapper:
# `viv export ports/liquids/pair_distribution.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/pair_distribution.viv.
#
# Upstream: pair_distribution of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "pair_distribution"
about = "ports/liquids/pair_distribution.viv"
files = ["ports/liquids/pair_distribution.viv"]
cases = "ports/liquids/pair_distribution.cases.json"

[params]
n = { type = "Int", min = 2, max = 1000000 }
box = { type = "Num", min_exclusive = 0.0 }
frames = { type = "Arr", rank = 2 }
dr = { type = "Num", min_exclusive = 0.0 }

[results]
r_mid = "Arr"
g = "Arr"
nframes_used = "Int"

[reference]
upstream = "pair_distribution of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
