# The Lennard-Jones equation of state of Thol et al. as one C file and a Python wrapper:
# `viv export ports/liquids/eos_lj.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/eos_lj.viv.
#
# Upstream: eos_lj of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "eos_lj"
about = "ports/liquids/eos_lj.viv"
files = ["ports/liquids/eos_lj.viv"]
cases = "ports/liquids/eos_lj.cases.json"

[params]
temperature = { type = "Num", min_exclusive = 0.0 }
density = { type = "Num", min_exclusive = 0.0 }

[results]
p_full = "Num"
e_full = "Num"
cv_full = "Num"
cp_full = "Num"
mu_full = "Num"
z_full = "Num"
p_cut = "Num"
e_cut = "Num"
mu_cut = "Num"
z_cut = "Num"
p_cs = "Num"
e_cs = "Num"
cv_cs = "Num"
cp_cs = "Num"
mu_cs = "Num"
z_cs = "Num"
a_res_full_table = { type = "Arr", rank = 2 }
a_res_cs_table = { type = "Arr", rank = 2 }

[reference]
upstream = "eos_lj of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
