# SPDX-FileCopyrightText: 2026 The Viv authors
# vipyr-liquids: the Lennard-Jones programs of Allen and Tildesley's examples
# (CC0; UPSTREAM.md) as a vipyr distribution. In a checkout vipyr finds it
# through the entry point below (vipyr/_packages.py), and `vp.liquids` is the
# module vipyr_liquids.
[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-liquids"
version = "0.0.1"
description = "Allen and Tildesley's Lennard-Jones molecular dynamics and Monte Carlo programs, ported to Viv, for vipyr"
readme = "README.md"
license = "CC0-1.0"
authors = [
    { name = "Michael P. Allen" },
    { name = "Dominic J. Tildesley" },
    { name = "Adam Zettel" },
]
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1", "numpy"]

[project.urls]
Upstream = "https://github.com/Allen-Tildesley/examples"
Book = "https://global.oup.com/academic/product/computer-simulation-of-liquids-9780198803201"

[project.entry-points."vipyr.packages"]
liquids = "vipyr_liquids"

[tool.vipyr]
packages = ["vipyr_liquids"]
# its programs compiled into the platform wheel (vipyr/_prebuilt.py)
prebuild = "registry"
prebuild-root = "../.."
