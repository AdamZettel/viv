# Errors of correlated time averages by block analysis as one C file and a Python wrapper:
# `viv export ports/liquids/error_calc.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/error_calc.viv.
#
# Upstream: error_calc of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "error_calc"
about = "ports/liquids/error_calc.viv"
files = ["ports/liquids/error_calc.viv"]
cases = "ports/liquids/error_calc.cases.json"

[params]
nstep = { type = "Int", min = 64, max = 100000000 }
nequil = { type = "Int", min = 0, max = 100000000 }
n_repeat = { type = "Int", min = 2, max = 100000 }
delta = { type = "Num", min_exclusive = 0.0 }
variance = { type = "Num", min_exclusive = 0.0 }
average = { type = "Num" }
seed = { type = "Int", min = 0, max = 2147483646 }
series = { type = "Arr", rank = 1 }

[results]
si_exact = "Num"
err_exact = "Num"
err_brute = "Num"
mean = "Num"
var = "Num"
err_naive = "Num"
tblock_fixed = "Arr"
err_fixed = "Arr"
si_fixed = "Arr"
tblock_halving = "Arr"
err_halving = "Arr"
si_halving = "Arr"

[reference]
upstream = "error_calc of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
