# SPDX-License-Identifier: CC0-1.0
# SPDX-FileCopyrightText: 2026 The Viv authors
# Lennard-Jones molecular dynamics at constant NVT (Nose-Hoover chain) as one C file and a Python wrapper:
# `viv export ports/liquids/md_nvt.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/md_nvt.viv.
#
# Upstream: md_nvt_lj (and its md_nvt_lj_ll build) of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "md_nvt"
about = "ports/liquids/md_nvt.viv"
files = ["ports/liquids/md_nvt.viv"]
cases = "ports/liquids/md_nvt.cases.json"

[params]
n = { type = "Int", min = 32, max = 100000 }
density = { type = "Num", min_exclusive = 0.0 }
temperature = { type = "Num", min_exclusive = 0.0 }
r_cut = { type = "Num", min_exclusive = 0.0 }
tau = { type = "Num", min_exclusive = 0.0 }
dt = { type = "Num", min_exclusive = 0.0 }
nblock = { type = "Int", min = 1, max = 100000 }
nstep = { type = "Int", min = 0, max = 100000000 }
neighbors = { type = "Enum", values = ["all", "link", "verlet"] }
seed = { type = "Int", min = 0, max = 2147483646 }
r_start = { type = "Arr", rank = 2 }
v_start = { type = "Arr", rank = 2 }
box_start = { type = "Num", min = 0.0 }
sample = { type = "Int", min = 0, max = 100000000 }
gr_dr = { type = "Num", min_exclusive = 0.0 }
nt = { type = "Int", min = 1, max = 1000000 }
origin_interval = { type = "Int", min = 1, max = 1000000 }

[results]
box = "Num"
rho = "Num"
e_cs = "Num"
e_cs_err = "Num"
p_cs = "Num"
p_cs_err = "Num"
e_full = "Num"
e_full_err = "Num"
p_full = "Num"
p_full_err = "Num"
t_kin = "Num"
t_kin_err = "Num"
t_config = "Num"
t_config_err = "Num"
conserved = "Num"
cv_cs = "Num"
cv_cs_err = "Num"
cv_full = "Num"
cv_full_err = "Num"
conserved_msd = "Num"
blocks = { type = "Arr", rank = 2 }
initial = "Arr"
energy_series = "Arr"
r_final = { type = "Arr", rank = 2 }
v_final = { type = "Arr", rank = 2 }
p_eta_final = "Arr"
eta_final = "Arr"
gr_r = "Arr"
gr = "Arr"
vacf = "Arr"
rvcf = "Arr"
msd = "Arr"
d_vacf = "Num"
d_msd = "Num"
corr_time = "Arr"

[reference]
upstream = "md_nvt_lj (and its md_nvt_lj_ll build) of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
