# Velocity autocorrelation, mean-square displacement and diffusion coefficient of a trajectory as one C file and a Python wrapper:
# `viv export ports/liquids/diffusion.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/diffusion.viv.
#
# Upstream: diffusion of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "diffusion"
about = "ports/liquids/diffusion.viv"
files = ["ports/liquids/diffusion.viv"]
cases = "ports/liquids/diffusion.cases.json"

[params]
n = { type = "Int", min = 1, max = 1000000 }
box = { type = "Num", min_exclusive = 0.0 }
delta = { type = "Num", min_exclusive = 0.0 }
frames_r = { type = "Arr", rank = 2 }
frames_v = { type = "Arr", rank = 2 }
nt = { type = "Int", min = 1, max = 1000000 }
origin_interval = { type = "Int", min = 1, max = 1000000 }

[results]
vacf = "Arr"
rvcf = "Arr"
msd = "Arr"
time = "Arr"
d_vacf = "Num"
d_msd = "Num"

[reference]
upstream = "diffusion of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
