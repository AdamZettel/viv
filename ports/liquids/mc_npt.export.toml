# SPDX-FileCopyrightText: 2026 The Viv authors
# Lennard-Jones Metropolis Monte Carlo at constant NPT as one C file and a Python wrapper:
# `viv export ports/liquids/mc_npt.export.toml`. Paths
# are under the repository root. A parameter left out of a run keeps the
# program's value; each parameter's meaning is the `#:` line above it in
# ports/liquids/mc_npt.viv.
#
# Upstream: mc_npt_lj of https://github.com/Allen-Tildesley/examples (CC0), by
# M. P. Allen and D. J. Tildesley, for Computer Simulation of Liquids, 2nd ed.
# (OUP, 2017). The comparison with upstream's Fortran is
# ports/liquids/COMPARISON.md; ports/liquids/test_liquids.py holds runs to it.
name = "mc_npt"
about = "ports/liquids/mc_npt.viv"
files = ["ports/liquids/mc_npt.viv"]
cases = "ports/liquids/mc_npt.cases.json"

[params]
n = { type = "Int", min = 32, max = 100000 }
density = { type = "Num", min_exclusive = 0.0 }
temperature = { type = "Num", min_exclusive = 0.0 }
r_cut = { type = "Num", min_exclusive = 0.0 }
pressure = { type = "Num" }
dr_max = { type = "Num", min_exclusive = 0.0 }
db_max = { type = "Num", min_exclusive = 0.0 }
nblock = { type = "Int", min = 1, max = 100000 }
nstep = { type = "Int", min = 0, max = 100000000 }
seed = { type = "Int", min = 0, max = 2147483646 }
r_start = { type = "Arr", rank = 2 }
box_start = { type = "Num", min = 0.0 }

[results]
box = "Num"
move_ratio = "Num"
volume_ratio = "Num"
density_avg = "Num"
density_err = "Num"
e_cut = "Num"
e_cut_err = "Num"
p_cut = "Num"
p_cut_err = "Num"
e_full = "Num"
e_full_err = "Num"
p_full = "Num"
p_full_err = "Num"
t_config = "Num"
t_config_err = "Num"
cp_cut = "Num"
cp_cut_err = "Num"
cp_full = "Num"
cp_full_err = "Num"
volume_msd = "Num"
box_final = "Num"
blocks = { type = "Arr", rank = 2 }
initial = "Arr"
energy_series = "Arr"
box_series = "Arr"
r_final = { type = "Arr", rank = 2 }

[reference]
upstream = "mc_npt_lj of https://github.com/Allen-Tildesley/examples at 4818bc82, built with gfortran -O2 by ports/liquids/oracle/build.py; same bits from the same start and random numbers"
tests = "ports/liquids/test_liquids.py: every tolerance is stated beside its check"
