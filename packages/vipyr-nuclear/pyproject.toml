# vipyr-nuclear: a vipyr distribution. `pip install vipyr[nuclear]` installs it;
# its families then appear as vp.nuclear through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-nuclear"
version = "0.0.1"
description = "Nuclear structure for vipyr: Skyrme Hartree-Fock and the nuclear shell model (vp.nuclear), written in Viv"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
nuclear = "vipyr_nuclear"

[tool.vipyr]
packages = ["vipyr_nuclear"]
# its programs compiled into the platform wheel (vipyr/_prebuilt.py)
prebuild = "registry"
prebuild-root = "../.."
