# vipyr-hardware: a vipyr distribution. `pip install vipyr[hardware]` installs it;
# its families then appear as vp.hardware through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-hardware"
version = "0.0.1"
description = "Hardware simulation for vipyr (placeholder)"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
hardware = "vipyr_hardware"

[tool.vipyr]
packages = ["vipyr_hardware"]
