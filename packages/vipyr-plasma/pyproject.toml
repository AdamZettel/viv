# vipyr-plasma: a vipyr distribution. `pip install vipyr[plasma]` installs it;
# its families then appear as vp.plasma through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-plasma"
version = "0.0.1"
description = "Plasma physics for vipyr: Vlasov-Poisson Landau damping (vp.plasma), written in Viv"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
plasma = "vipyr_plasma"

[tool.vipyr]
packages = ["vipyr_plasma"]
# its programs compiled into the platform wheel (vipyr/_prebuilt.py)
prebuild = "registry"
prebuild-root = "../.."
