# vipyr-chem: a vipyr distribution. `pip install vipyr[chem]` installs it;
# its families then appear as vp.scf, vp.dft through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-chem"
version = "0.0.1"
description = "Quantum chemistry and solids for vipyr: Hartree-Fock (vp.scf) and plane-wave DFT (vp.dft), written in Viv"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
scf = "vipyr_chem.scf"
dft = "vipyr_chem.dft"

[tool.vipyr]
packages = ["vipyr_chem"]
# its programs compiled into the platform wheel (vipyr/_prebuilt.py)
prebuild = "registry"
prebuild-root = "../.."
