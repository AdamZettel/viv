# vipyr-xc: a vipyr distribution. `pip install vipyr[xc]` installs it;
# its families then appear as vp.xc through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-xc"
version = "0.0.1"
description = "Exchange-correlation functionals for vipyr, translated from Libxc (MPL-2.0)"
license = "MPL-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
xc = "vipyr_xc"

[tool.vipyr]
packages = ["vipyr_xc"]
