# vipyr-symreg: a vipyr distribution. `pip install vipyr[symreg]` installs it;
# its families then appear as vp.symreg through the
# `vipyr.packages` entry points below. In a checkout of the Viv repository
# vipyr finds this directory without an install (python/vipyr/_packages.py).

[build-system]
requires = ["vipyr"]
build-backend = "vipyr.build"

[project]
name = "vipyr-symreg"
version = "0.0.1"
description = "Symbolic regression for vipyr (placeholder)"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["vipyr==0.0.1"]

[project.entry-points."vipyr.packages"]
symreg = "vipyr_symreg"

[tool.vipyr]
packages = ["vipyr_symreg"]
