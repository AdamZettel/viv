# The 2D Ising model as one C file and a Python wrapper:
# `viv export stat/ising/ising_mc.export.toml`.
# Paths are under the repository root. A parameter left out of a run keeps
# the program's value (size 16, temperature 2.0, Metropolis, 2000 sweeps after 500);
# each parameter's meaning is the `#:` line above it in stat/ising/ising_mc.viv.
#
# The bounds are what the program can run. size must also be even (the
# checkerboard), bins at most sweeps, and Wolff needs coupling > 0: the program
# checks those and stops with a message. The tests that hold the runs to
# exact results are stat/ising/test_ising.py.
name = "ising"
about = "stat/ising/ising_mc.viv"
files = ["stat/ising/ising_mc.viv"]
cases = "stat/ising/ising_mc.cases.json"

[params]
size = { type = "Int", min = 4, max = 4096 }
temperature = { type = "Num", min_exclusive = 0.0 }
coupling = { type = "Num" }
field = { type = "Num" }
algorithm = { type = "Enum", values = ["metropolis", "wolff"] }
start = { type = "Enum", values = ["cold", "hot"] }
sweeps = { type = "Int", min = 2, max = 100000000 }
thermalization = { type = "Int", min = 0, max = 100000000 }
seed = { type = "Int", min = 0, max = 4294967295 }
bins = { type = "Int", min = 2, max = 100000 }

[results]
energy = "Num"
energy_err = "Num"
mag_abs = "Num"
mag_abs_err = "Num"
mag = "Num"
mag_err = "Num"
heat = "Num"
heat_err = "Num"
chi = "Num"
chi_err = "Num"
binder = "Num"
binder_err = "Num"
tau_energy = "Num"
tau_mag = "Num"
accept = "Num"
energy_series = "Arr"
mag_series = "Arr"
spins = { type = "Arr", rank = 2 }
t_critical = "Num"
exact_known = "Bool"
exact_energy = "Num"
exact_heat = "Num"
energy_infinite = "Num"
mag_infinite = "Num"

[reference]
exact = "Onsager, Phys. Rev. 65, 117 (1944): T_c and the infinite lattice's energy; Yang, Phys. Rev. 85, 808 (1952): the spontaneous magnetization; Kaufman, Phys. Rev. 76, 1232 (1949), as Ferdinand and Fisher, Phys. Rev. 185, 832 (1969) eq. 2.1, write it: the finite periodic lattice's partition function"
rng = "Philox4x32-10, Salmon, Moraes, Dror and Shaw, SC11 (2011); Random123's known-answer vectors pass in lib/ising.viv"
tests = "stat/ising/test_ising.py: every tolerance is stated beside its check"
