[[rule]]
id = "np.full_like"
match = "np.full_like(x, v, /)"
exactness = "exact"
evidence = "mapping.py:23 np.full_like(v, 4.0): bitwise; fill keeps the sign of a zero"
cases = [
  { eval = ["x"] },
  { if = "not x.arr", refuse = "{name} of {x.words}", hint = "Pass an array." },
  { if = "nkw > 0", refuse = "{name} with keywords", hint = "Drop them." },
  { eval = ["v"] },
  { if = "not v.scalar", refuse = "{name} with a fill value that is {v.words}", hint = "Fill with a number." },
  { if = "x.kind == 'carr'", use = ["py_cfillin"], viv = "py_cfillin(czeros({dims_like(x)}), {v})", type = "x" },
  { if = "v.kind == 'cnum'", refuse = "{name} of a real array with a complex value", hint = "NumPy discards the imaginary part (with a warning); take .real." },
  { if = "x.py == 'int' and v.py != 'int'", refuse = "{name} of an int array with a value that is not an int", hint = "NumPy truncates the value to the array's int dtype; pass an int." },
  { if = "x.py == 'bool' and v.kind != 'bool'", refuse = "{name} of a Bool array with a number", hint = "Fill with True or False." },
  { if = "v.kind == 'bool'", use = ["py_b01"] },
  { use = ["py_fillin"], viv = "py_fillin(zeros({dims_like(x)}), {'py_b01(' + v.code + ')' if v.kind == 'bool' else v.code})", type = "T('arr', x.rank, x.py, 'nd')" },
]
tests = [{ x = [3.0, -1.0, 2.5], v = 4.0 }, { x = [1, 2], v = 7 }, { x = [3.0, -1.0], v = -0.0 }, { x = ["1+1j", "2-0.5j"], v = 2.5 }]

[[rule]]
id = "np.linspace"
match = "np.linspace(start, stop, num=50)"
exactness = "exact"
evidence = "mapping.py:21 x = np.linspace(-1.5, 2.0, 8): bitwise; py_linspace is NumPy 1.24's formula (k * step + start, the last entry stop, one entry for num = 1)"
cases = [
  { if = "len(extra_kws) > 0", refuse = "linspace with {extra_kws[0]}=", hint = "Only linspace(start, stop, num) is in the subset (endpoint=False: np.arange)." },
  { eval = ["start", "stop", "num"] },
  { if = "not (start.kind == 'num' and stop.kind == 'num')", refuse = "np.linspace from {start.words} to {stop.words}", hint = "Only real numbers for start and stop." },
  { if = "num.kind != 'num' or num.py != 'int'", refuse = "np.linspace with a count that is not an int", hint = "NumPy raises TypeError; pass an int." },
  { use = ["py_linspace"], viv = "py_linspace({start}, {stop}, {num})", type = "arr(1)" },
]
tests = [{ start = -1.5, stop = 2.0, num = 8 }, { start = 0.0, stop = 1.0, num = 11 }, { start = 0, stop = 1, num = 1 }]

[[rule]]
id = "np.arange"
match = "np.arange(a, b=None, c=None, /, dtype=None)"
params = { dtype = "dtype" }
exactness = "exact"
evidence = "mapping.py:20 np.arange(5), (1.0, 2.0, 0.25), (10, 0, -3): bitwise; py_arange fills as NumPy does, start + k * delta with delta = (start + step) - start"
cases = [
  { if = "len(extra_kws) > 0", refuse = "arange with keywords", hint = "Pass start, stop, step positionally." },
  { eval = ["a", "b", "c"] },
  { if = "not (a.kind == 'num' and (b.kind == 'num' or not b.given) and (c.kind == 'num' or not c.given))", refuse = "np.arange of something other than real numbers", hint = "Pass start, stop and step as numbers." },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64']", refuse = "np.arange(..., dtype={dtype})", hint = "Only float and int." },
  { if = "dtype in ['int', 'np.int64'] and not all_int(a, b, c)", refuse = "np.arange(..., dtype=int) of floats", hint = "NumPy computes the length in floats and the entries in ints; pass ints." },
  { if = "not b.given", use = ["py_arange"], viv = "py_arange(0, {a}, 1)", type = "arr(1, 'float' if dtype in ['float', 'np.float64'] else ('int' if all_int(a) else 'float'))" },
  { if = "not c.given", use = ["py_arange"], viv = "py_arange({a}, {b}, 1)", type = "arr(1, 'float' if dtype in ['float', 'np.float64'] else ('int' if all_int(a, b) else 'float'))" },
  { use = ["py_arange"], viv = "py_arange({a}, {b}, {c})", type = "arr(1, 'float' if dtype in ['float', 'np.float64'] else ('int' if all_int(a, b, c) else 'float'))" },
]
tests = [{ a = 5 }, { a = 1.0, b = 2.0, c = 0.25 }, { a = 10, b = 0, c = -3 }, { a = 4, dtype = "float" }]

[[rule]]
id = "np.eye"
match = "np.eye(N, M=None, k=0, dtype=None)"
params = { dtype = "dtype" }
exactness = "exact"
evidence = "mapping.py:22 np.eye(3), np.eye(3, k=1): bitwise; the builtin eye(n, m, k), checked against NumPy in tools/arrays/numpy_cases.py"
cases = [
  { keywords = ["k", "dtype", "M"], refuse = "np.eye(..., {kw}=)", hint = "Drop it." },
  { eval = ["N", "M", "k"] },
  { if = "N.kind != 'num' or N.py != 'int' or k.kind != 'num' or k.py != 'int'", refuse = "np.eye of a size or offset that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "M.given and not (M.syntax == 'Constant' and M.lit == None) and (M.kind != 'num' or M.py != 'int')", refuse = "np.eye of a size or offset that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64']", refuse = "np.eye(..., dtype={dtype})", hint = "Only float and int." },
  { if = "M.given and not (M.syntax == 'Constant' and M.lit == None)", viv = "eye({size(N)}, {size(M)}, {k})", type = "arr(2, 'int' if dtype in ['int', 'np.int64'] else 'float')" },
  { viv = "eye({size(N)}, {size(N)}, {k})", type = "arr(2, 'int' if dtype in ['int', 'np.int64'] else 'float')" },
]
tests = [{ N = 3 }, { N = 3, k = 1 }, { N = 2, dtype = "int" }, { N = 2, M = 4, k = -1 }]

