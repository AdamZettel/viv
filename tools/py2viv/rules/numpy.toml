# ---------------------------------------------------------------- one-argument functions, elementwise
#
# The same Viv builtin, one argument, elementwise on arrays. Each name is spelled out: a name
# with another module path in the middle (np.emath.sqrt, np.linalg.sqrt) reaches no rule here
# (np.emath is refused above; np.linalg.sqrt does not exist, and is refused as an unknown
# NumPy function). Of a math.* function of a number, `mpath` picks the guarded form: `guard`
# (py_msqrt, py_mlog, ...: stop where math raises ValueError or OverflowError), `trig`
# (py_mtrig: stop at an infinite argument), `hyp` (py_mhyp: stop on overflow), `floor` (an
# int). A math.* function of an array raises TypeError in Python and is refused. NumPy's
# second positional argument is `out`, the array the result is written into (np.log(x, b) is
# not a logarithm to base b), and is refused.

[[family]]
id = "elementwise"
cases = [
  { if = "nargs > 1 and module == 'np'", refuse = "{name} with a second positional argument", hint = "NumPy's second argument is `out`, the array the result is written into{', not a base (write np.log(x) / np.log(b))' if short == 'log' else ''}; drop it." },
  { eval = ["x"] },
  { if = "module == 'math' and x.kind not in ['num', 'unknown']", refuse = "{name} of {x.words}", hint = "math functions take one real number (Python raises TypeError); use the NumPy function for an array." },
  { if = "x.arr and x.py == 'bool'", refuse = "{name} of a Bool array", hint = "NumPy computes it in float16; use a number array." },
  { if = "fn not in ['sqrt', 'abs', 'floor', 'ceil'] or x.kind in ['cnum', 'carr']", inexact = "{fn} (Viv's libm is not the platform's)", exactness = "tolerance", rtol = 2.2e-16, atol = 0.0, evidence = "a libm function, or a complex argument: 1 ulp against the platform's (SUBSET.md)" },
  { if = "module == 'math' and x.kind == 'num' and mpath == 'guard'", use = ["{mhelper}"], viv = "{mhelper}({x})", type = "NUM_F" },
  { if = "module == 'math' and x.kind == 'num' and mpath == 'trig'", use = ["py_mtrig"], viv = "{fn}(py_mtrig({x}))", type = "NUM_F" },
  { if = "module == 'math' and x.kind == 'num' and mpath == 'hyp'", tmps = ["x"], hoist = ["{tmp_x} = {x}"], use = ["py_mhyp"], viv = "py_mhyp({fn}({tmp_x}), {tmp_x})", type = "NUM_F" },
  { if = "module == 'math' and x.kind == 'num' and mpath == 'floor'", use = ["py_m{fn}"], viv = "py_m{fn}({x})", type = "NUM_I" },
  { if = "x.kind == 'bool'", refuse = "{name} of a Bool", hint = "Use a number." },
  { if = "short == 'fabs' and x.kind in ['cnum', 'carr']", refuse = "np.fabs of a complex value", hint = "NumPy raises TypeError; np.abs takes complex values." },
  { if = "x.kind == 'carr' and fn != 'abs'", refuse = "{name} of a complex array", hint = "Viv's {fn} takes a complex number, not a complex array: loop over the entries." },
  { if = "x.kind == 'cnum' and fn not in ['abs', 'exp', 'log', 'sqrt', 'sin', 'cos', 'tan']", refuse = "{name} of a complex number", hint = "Only abs/exp/log/sqrt/sin/cos/tan take complex values." },
  { if = "x.arr", viv = "{fn}({x})", type = "arr(x.rank) if x.kind == 'arr' or fn == 'abs' else x" },
  { if = "x.kind == 'cnum'", viv = "{fn}({x})", type = "NUM_F if fn == 'abs' else CNUM" },
  { viv = "{fn}({x})", type = "NUM_I if short in ['floor', 'ceil'] and module == 'math' else NUM_F" },
]

