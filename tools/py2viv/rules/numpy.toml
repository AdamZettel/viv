[[rule]]
id = "np.full"
match = "np.full(shape, fill_value, dtype=None)"
params = { shape = "shape", dtype = "dtype" }
exactness = "exact"
evidence = "mapping.py:19 np.full(3, 2.5), np.full((2, 2), -1.0): bitwise; fill keeps the sign of a zero"
cases = [
  { eval = ["shape"] },
  { keywords = ["dtype", "fill_value"], refuse = "{name}(..., {kw}=)", hint = "Drop it." },
  { if = "not shape.dims_int", refuse = "{name} of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "dtype in ['complex', 'np.complex128']", refuse = "a complex {name}", hint = "Use np.zeros(n, dtype=complex) and fill it." },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64', 'bool', 'np.bool_']", refuse = "dtype={dtype}", hint = "Viv arrays hold float64 (or complex)." },
  { if = "shape.ndims > 4", refuse = "an array of rank {shape.ndims}", hint = "Viv arrays have rank 1 to 4." },
  { eval = ["fill_value"] },
  { if = "not fill_value.scalar or fill_value.kind == 'cnum'", refuse = "{name} with a fill value that is {fill_value.words}", hint = "Fill with a real number." },
  { if = "dtype in ['int', 'np.int64'] and fill_value.py != 'int'", refuse = "{name}(..., dtype=int) of a fill value that is not an int", hint = "NumPy truncates it; pass an int." },
  { if = "dtype in ['bool', 'np.bool_'] and fill_value.kind != 'bool'", refuse = "{name}(..., dtype=bool) of a number", hint = "Fill with True or False." },
  { if = "fill_value.kind == 'bool'", use = ["py_b01"] },
  { if = "shape.ndims == 1", use = ["py_full"], viv = "py_full({sizes(shape)}, {'py_b01(' + fill_value.code + ')' if fill_value.kind == 'bool' else fill_value.code})", type = "T('arr', shape.ndims, 'int' if dtype in ['int', 'np.int64'] else ('bool' if dtype in ['bool', 'np.bool_'] else ('float' if dtype != None else fill_value.py)), 'nd')" },
  { if = "shape.ndims == 2", use = ["py_full2"], viv = "py_full2({sizes(shape)}, {'py_b01(' + fill_value.code + ')' if fill_value.kind == 'bool' else fill_value.code})", type = "T('arr', shape.ndims, 'int' if dtype in ['int', 'np.int64'] else ('bool' if dtype in ['bool', 'np.bool_'] else ('float' if dtype != None else fill_value.py)), 'nd')" },
  { refuse = "np.full of rank {shape.ndims}", hint = "Allocate np.zeros and fill it." },
]
tests = [{ shape = 3, fill_value = 2.5 }, { shape = [2, 2], fill_value = -1.0 }, { shape = 3, fill_value = 2 }, { shape = 2, fill_value = true }]

[[rule]]
id = "np.zeros_like"
match = ["np.zeros_like(x, /)", "np.empty_like(x, /)"]
exactness = "exact"
evidence = "mapping.py:23 np.zeros_like(M): bitwise"
cases = [
  { if = "not x.arr", refuse = "{name} of {x.words}", hint = "Pass an array." },
  { if = "nkw > 0", refuse = "{name} with keywords", hint = "Drop them." },
  { if = "x.kind == 'carr'", viv = "czeros({dims_like(x)})", type = "x" },
  { viv = "zeros({dims_like(x)})", type = "T('arr', x.rank, x.py, 'nd')" },
]
tests = [{ x = [[1.0, 2.0], [3.0, 4.0]] }, { x = [1, 2, 3] }]

[[rule]]
