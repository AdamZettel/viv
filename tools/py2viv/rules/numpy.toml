# ---------------------------------------------------------------- reductions along an axis
#
# `np.sum(A, axis=0)`, `A.mean(axis=-1, keepdims=True)`, `np.max(T, 1)`: the rules above take
# a call without an axis (and without keepdims=True); these take the rest. The helpers reduce
# in NumPy's own order (helpers.toml, "reductions along an axis"): a sum along the last axis
# is NumPy's blocked pairwise sum, along any other axis the slabs added in order. A matrix
# NumPy may hold in a transpose's memory order is summed as NumPy sums it (a transpose itself:
# the original, along the other axis) or refused.

[[family]]
id = "reduce-axis"
exactness = "exact"
evidence = "check_rules.py's generated cases: every axis of ranks 1 to 3, negative axes, keepdims, the edge values; the order of each reduction checked against NumPy 1.24 on random arrays up to 30000 entries (results/axis_order.txt)"
cases = [
  { eval = ["a"] },
  { if = "not a.arr", refuse = "{name} of {a.words} with axis= or keepdims=", hint = "Pass a real array." },
  { if = "a.kind == 'carr'", refuse = "{name} of a complex array with axis= or keepdims=", hint = "Reduce the real and imaginary parts." },
  { if = "a.py == 'mixed'", refuse = "{name} of a list mixing ints and floats", hint = "Make them all floats." },
  { if = "a.py == 'bool' and op != 'sum'", refuse = "{name} of a Bool array with axis= or keepdims=", hint = "Use a number array." },
  { if = "in_grad", refuse = "{name} with axis= or keepdims= inside a differentiated def", hint = "Write the loop over the axis; Viv's grad does not follow NumPy's order of summation." },
  { if = "axis.given and not (axis.syntax == 'Constant' and axis.lit == None) and axis.axis_lit == None", refuse = "{name} with an axis that is not an int literal", hint = "Write the axis as a number (a tuple of axes is not in the subset).", at = "axis" },
  { if = "keepdims.given and not (keepdims.syntax == 'Constant' and keepdims.lit in [True, False, 0, 1])", refuse = "{name} with keepdims={keepdims.code}", hint = "Pass keepdims=True or keepdims=False.", at = "keepdims" },
  { if = "axis.axis_lit != None and (axis.axis_lit < 0 - a.rank or axis.axis_lit >= a.rank)", refuse = "{name} with axis={axis.axis_lit} of {a.words}", hint = "NumPy raises AxisError: the axes of a rank-{a.rank} array are {0 - a.rank} to {a.rank - 1}.", at = "axis" },
  { if = "a.rank > 4 - kd(keepdims)", refuse = "{name} of {a.words}", hint = "Viv's arrays have at most four axes." },
  { if = "order and a.rank >= 2 and a.f_order and not a.transposed", refuse = "{name} of a matrix NumPy may hold in a transpose's memory order", hint = "NumPy reduces a transpose, and what is computed elementwise from one, in memory order; the translation's transpose is a copy in row order. Reduce the untransposed array, or copy it in row order first (`.copy()`)." },
  { if = "order and a.transposed and axk(axis, a) >= 0 and kd(keepdims) == 1", use = ["{helper}"], viv = "transpose({helper}(transpose({a}), {1 - axk(axis, a)}, 1{flag}))", type = "arr(2, 'int' if intres or a.py in ['int', 'bool'] and intin else 'float')" },
  { if = "order and a.transposed", use = ["{helper}"], viv = "{helper}(transpose({a}), {1 - axk(axis, a) if axk(axis, a) >= 0 else -1}, {kd(keepdims)}{flag})", type = "arr(2 if axk(axis, a) < 0 else 1, 'int' if intres or a.py in ['int', 'bool'] and intin else 'float')" },
  { if = "a.rank == 1 and axk(axis, a) >= 0 and kd(keepdims) == 0 and a.py in ['int', 'bool'] and op == 'sum'", use = ["py_isum_ax"], viv = "py_isum_ax({a}, 0, 1)[0]", type = "NUM_I" },
  { if = "a.rank == 1 and axk(axis, a) >= 0 and kd(keepdims) == 0 and a.py in ['int', 'bool'] and op == 'prod'", use = ["{helper}", "py_int"], viv = "py_int({helper}({a}, 0, 1{flag})[0])", type = "NUM_I" },
  { if = "a.rank == 1 and axk(axis, a) >= 0 and kd(keepdims) == 0", use = ["{helper}"], viv = "{helper}({a}, 0, 1{flag})[0]", type = "NUM_I if intres or a.py in ['int', 'bool'] and intin else NUM_F" },
  { if = "a.py in ['int', 'bool'] and op == 'sum'", use = ["py_isum_ax"], viv = "py_isum_ax({a}, {axk(axis, a)}, {kd(keepdims)})", type = "arr(a.rank if axk(axis, a) < 0 else a.rank - 1 + kd(keepdims), 'int')" },
  { if = "a.py in ['int', 'bool'] and op == 'prod'", use = ["{helper}", "py_int_arr"], viv = "py_int_arr({helper}({a}, {axk(axis, a)}, {kd(keepdims)}{flag}))", type = "arr(a.rank if axk(axis, a) < 0 else a.rank - 1 + kd(keepdims), 'int')" },
  { use = ["{helper}"], viv = "{helper}({a}, {axk(axis, a)}, {kd(keepdims)}{flag})", type = "arr(a.rank if axk(axis, a) < 0 else a.rank - 1 + kd(keepdims), 'int' if intres or a.py in ['int', 'bool'] and intin else 'float')" },
]

