# ---------------------------------------------------------------- np.random (lib/nprandom)
#
# NumPy's random numbers, draw for draw: np.random's legacy functions over its global MT19937
# (family np-random-legacy) and a Generator's methods over PCG64 (family np-random-generator),
# computed by lib/nprandom (the helpers npr_*, py_npr_*, py_npg_*). The source they follow is
# NumPy 1.24.4 (tag v1.24.4, commit 9315a9072b2636f75c831b4eca9f42a5f67ca2fb): mtrand.pyx,
# _generator.pyx, _bounded_integers.pyx.in, bit_generator.pyx, src/mt19937, src/pcg64 and
# src/distributions/distributions.c. A legacy draw is translated only in a file that calls
# np.random.seed (`np_seeded`), and stops at run time if it comes before the seed; a Generator
# only from default_rng(seed) with a seed. np.random.randn, standard_normal and normal are
# refused: NumPy computes them with the platform's log, whose last bit Viv's libm does not
# reproduce. A Generator's normals stop at run time in the few draws whose value rests on the
# platform's log1p or exp (the ziggurat's tail). The size is None, an int or a pair; each
# helper checks the arguments and the size where NumPy does, in NumPy's order.
# check_rules.py runs each rule after `setup` (Python lines), from several seeds, sizes and
# interleavings (Gen.random_cases).

[[family]]
id = "np-random-legacy"
exactness = "exact"
evidence = "lib/nprandom/selftest.viv: NumPy 1.24.4's own draws, equal in the three engines; check_rules.py's np.random cases"
setup = ["np.random.seed(12345)"]

[[family.rule]]
id = "np.random.seed"
match = "np.random.seed(seed=None)"
setup = []
cases = [
  { if = "not seed.given or seed.syntax == 'Constant' and seed.lit == None", refuse = "np.random.seed() without a seed", hint = "NumPy then seeds from the operating system, and its values cannot be reproduced; pass an int." },
  { eval = ["seed"] },
  { if = "seed.kind == 'num' and seed.py == 'int'", use = ["py_npr_seed"], viv = "py_npr_seed({seed})", type = "NONE" },
  { if = "seed.arr and seed.rank == 1 and seed.py == 'int'", use = ["py_npr_seed_array"], viv = "py_npr_seed_array({seed})", type = "NONE" },
  { refuse = "np.random.seed of {seed.words}", hint = "Pass an int in [0, 2**32 - 1], or a list of them; NumPy raises TypeError for a float." },
]
tests = [{ seed = 0 }, { seed = 4294967295 }, { seed = [1, 2, 3] }]

[[family.rule]]
id = "np.random.rand"
match = "np.random.rand(d0=None, d1=None, /, *more)"
cases = [
  { if = "not np_seeded", refuse = "np.random.rand without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { if = "nargs > 2", refuse = "np.random.rand of rank {nargs}", hint = "Translated sizes have one or two dimensions." },
  { if = "not d0.given", use = ["py_npr_rand"], viv = "py_npr_rand()", type = "NUM_F" },
  { eval = ["d0", "d1"] },
  { if = "not all_int(d0, d1) or d0.kind != 'num' or d1.given and d1.kind != 'num'", refuse = "np.random.rand of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "not d1.given", use = ["py_npr_rand"], viv = "py_npr_rand_v({d0})", type = "arr(1)" },
  { use = ["py_npr_rand"], viv = "py_npr_rand_m({d0}, {d1})", type = "arr(2)" },
]
tests = [{}, { d0 = 5 }, { d0 = 2, d1 = 3 }]

[[family.rule]]
id = "np.random.random_sample"
match = ["np.random.random_sample(size=None)", "np.random.random(size=None)", "np.random.ranf(size=None)", "np.random.sample(size=None)"]
params = { size = "shape" }
cases = [
  { if = "not np_seeded", refuse = "{name} without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { if = "not size.given or size.syntax == 'Constant' and size.lit == None", use = ["py_npr_rand"], viv = "py_npr_rand()", type = "NUM_F" },
  { eval = ["size"] },
  { if = "not size.dims_int", refuse = "{name} of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "size.ndims == 1", use = ["py_npr_rand"], viv = "py_npr_rand_v({size})", type = "arr(1)" },
  { if = "size.ndims == 2", use = ["py_npr_rand"], viv = "py_npr_rand_m({size})", type = "arr(2)" },
  { refuse = "{name} of a size with {size.ndims} dimensions", hint = "Translated sizes have one or two dimensions." },
]
tests = [{}, { size = 4 }, { size = [2, 3] }]

[[family.rule]]
id = "np.random.uniform"
match = "np.random.uniform(low=0.0, high=1.0, size=None)"
params = { size = "shape" }
cases = [
  { if = "not np_seeded", refuse = "np.random.uniform without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { eval = ["low", "high"] },
  { if = "low.kind not in ['num', 'bool'] or high.kind not in ['num', 'bool']", refuse = "np.random.uniform of {low.words} and {high.words}", hint = "Pass numbers; array bounds broadcast, which is not translated." },
  { if = "not size.given or size.syntax == 'Constant' and size.lit == None", use = ["py_npr_uniform"], viv = "py_npr_uniform({low}, {high})", type = "NUM_F" },
  { eval = ["size"] },
  { if = "not size.dims_int", refuse = "np.random.uniform of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "size.ndims == 1", use = ["py_npr_uniform"], viv = "py_npr_uniform_v({low}, {high}, {size})", type = "arr(1)" },
  { if = "size.ndims == 2", use = ["py_npr_uniform"], viv = "py_npr_uniform_m({low}, {high}, {size})", type = "arr(2)" },
  { refuse = "np.random.uniform of a size with {size.ndims} dimensions", hint = "Translated sizes have one or two dimensions." },
]
tests = [{}, { low = -2.0, high = 3.0 }, { low = 1.0, high = 5.0, size = 4 }, { low = 0.0, high = 1.0, size = [2, 2] }]

[[family.rule]]
id = "np.random.randint"
match = "np.random.randint(low, high=None, size=None, dtype=None)"
params = { size = "shape", dtype = "dtype" }
cases = [
  { if = "not np_seeded", refuse = "np.random.randint without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { if = "dtype == None and ('dtype' in kw_names or nargs > 3)", refuse = "np.random.randint with dtype=None", hint = "NumPy reads dtype=None as float64 and raises TypeError; leave the dtype out." },
  { if = "dtype not in [None, 'int', 'np.int64', 'int64', 'np.int_']", refuse = "np.random.randint with dtype={dtype}", hint = "Other dtypes draw differently (NumPy buffers the words of narrow ints); use the default int." },
  { eval = ["low", "high"] },
  { if = "low.kind != 'num' or low.py != 'int' or high.given and not (high.syntax == 'Constant' and high.lit == None) and (high.kind != 'num' or high.py != 'int')", refuse = "np.random.randint of {low.words} and {high.words}", hint = "Pass ints; NumPy truncates a float bound, and array bounds broadcast." },
  { if = "high.given and not (high.syntax == 'Constant' and high.lit == None) and (not size.given or size.syntax == 'Constant' and size.lit == None)", use = ["py_npr_randint"], viv = "py_npr_randint({low}, {high})", type = "NUM_I" },
  { if = "not size.given or size.syntax == 'Constant' and size.lit == None", use = ["py_npr_randint"], viv = "py_npr_randint(0, {low})", type = "NUM_I" },
  { eval = ["size"] },
  { if = "not size.dims_int", refuse = "np.random.randint of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "size.ndims > 2", refuse = "np.random.randint of a size with {size.ndims} dimensions", hint = "Translated sizes have one or two dimensions." },
  { if = "high.given and not (high.syntax == 'Constant' and high.lit == None) and size.ndims == 1", use = ["py_npr_randint"], viv = "py_npr_randint_v({low}, {high}, {size})", type = "T('arr', 1, 'int', 'nd')" },
  { if = "high.given and not (high.syntax == 'Constant' and high.lit == None)", use = ["py_npr_randint"], viv = "py_npr_randint_m({low}, {high}, {size})", type = "T('arr', 2, 'int', 'nd')" },
  { if = "size.ndims == 1", use = ["py_npr_randint"], viv = "py_npr_randint_v(0, {low}, {size})", type = "T('arr', 1, 'int', 'nd')" },
  { use = ["py_npr_randint"], viv = "py_npr_randint_m(0, {low}, {size})", type = "T('arr', 2, 'int', 'nd')" },
]
tests = [{ low = 10 }, { low = -3, high = 7 }, { low = 0, high = 10, size = 6 }, { low = 1, high = 4294967297, size = 3 }, { low = 5, high = 9, size = [2, 3] }]

[[family.rule]]
id = "np.random.choice"
match = "np.random.choice(a, size=None, replace=True, p=None)"
params = { size = "shape" }
cases = [
  { if = "not np_seeded", refuse = "np.random.choice without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { if = "replace.given", eval = ["replace"] },
  { if = "replace.given and replace.kind != 'bool'", refuse = "np.random.choice with replace= that is {replace.words}", hint = "Pass True or False." },
  { if = "replace.given and replace.syntax != 'Constant'", use = ["py_b01"] },
  { eval = ["a"] },
  { if = "not (a.kind == 'num' and a.py == 'int' or a.arr and a.kind == 'arr' and a.rank == 1 and a.py in ['int', 'float'])", refuse = "np.random.choice from {a.words}", hint = "Pass an int (the population size) or a vector of numbers; NumPy raises ValueError for a float or a matrix." },
  { if = "size.given and not (size.syntax == 'Constant' and size.lit == None)", eval = ["size"] },
  { if = "size.given and not (size.syntax == 'Constant' and size.lit == None) and (not size.dims_int or size.ndims != 1)", refuse = "np.random.choice with this size", hint = "Pass an int size (or none); NumPy raises TypeError for a float, and a shape with two dimensions is not translated." },
  { if = "p.given and not (p.syntax == 'Constant' and p.lit == None)", eval = ["p"] },
  { if = "p.given and not (p.syntax == 'Constant' and p.lit == None) and not (p.arr and p.kind == 'arr' and p.rank == 1 and p.py in ['int', 'float'])", refuse = "np.random.choice with p that is {p.words}", hint = "Pass a vector of probabilities." },
  { if = "a.kind == 'num' and (not size.given or size.syntax == 'Constant' and size.lit == None)", use = ["py_npr_choice"], viv = "py_npr_choice1({a}, {('1' if replace.lit else '0') if replace.given and replace.syntax == 'Constant' else (('py_b01(' + replace.code + ')') if replace.given else '1')}, {p.code if p.given and not (p.syntax == 'Constant' and p.lit == None) else 'zeros(0)'}, {1 if p.given and not (p.syntax == 'Constant' and p.lit == None) else 0})", type = "NUM_I" },
  { if = "a.kind == 'num'", use = ["py_npr_choice"], viv = "py_npr_choice_n({a}, {size}, {('1' if replace.lit else '0') if replace.given and replace.syntax == 'Constant' else (('py_b01(' + replace.code + ')') if replace.given else '1')}, {p.code if p.given and not (p.syntax == 'Constant' and p.lit == None) else 'zeros(0)'}, {1 if p.given and not (p.syntax == 'Constant' and p.lit == None) else 0})", type = "T('arr', 1, 'int', 'nd')" },
  { if = "not size.given or size.syntax == 'Constant' and size.lit == None", use = ["py_npr_choice"], viv = "py_npr_choice_a1({a}, {('1' if replace.lit else '0') if replace.given and replace.syntax == 'Constant' else (('py_b01(' + replace.code + ')') if replace.given else '1')}, {p.code if p.given and not (p.syntax == 'Constant' and p.lit == None) else 'zeros(0)'}, {1 if p.given and not (p.syntax == 'Constant' and p.lit == None) else 0})", type = "T('num', 0, a.py)" },
  { use = ["py_npr_choice"], viv = "py_npr_choice_a({a}, {size}, {('1' if replace.lit else '0') if replace.given and replace.syntax == 'Constant' else (('py_b01(' + replace.code + ')') if replace.given else '1')}, {p.code if p.given and not (p.syntax == 'Constant' and p.lit == None) else 'zeros(0)'}, {1 if p.given and not (p.syntax == 'Constant' and p.lit == None) else 0})", type = "T('arr', 1, a.py, 'nd')" },
]
tests = [{ a = 10 }, { a = 10, size = 6 }, { a = [1.5, -2.0, 3.25, 4.0], size = 3 }, { a = 5, size = 4, replace = false }, { a = 4, size = 6, p = [0.1, 0.2, 0.3, 0.4] }, { a = 4, size = 3, replace = false, p = [0.1, 0.2, 0.3, 0.4] }]

[[family.rule]]
id = "np.random.shuffle"
match = "np.random.shuffle(x, /)"
cases = [
  { if = "not np_seeded", refuse = "np.random.shuffle without np.random.seed in this file", hint = "NumPy seeds np.random from the operating system; call np.random.seed(s) first." },
  { if = "x.syntax != 'Name'", refuse = "np.random.shuffle of an expression", hint = "Shuffle a variable: NumPy shuffles it in place, and a slice would be a copy in the translation." },
