  { if = "x.rank > 2 or y.rank > 2", refuse = "{name} of {x.words} and {y.words}", hint = "Only vectors and matrices (np.dot and np.matmul differ above rank 2)." },
  { if = "x.kind == 'carr' and y.kind == 'carr' and x.rank == 1 and y.rank == 1 and name == 'np.vdot'", use = ["py_cvdot"], viv = "py_cvdot({x}, {y})", type = "CNUM" },
  { if = "x.kind == 'carr' and y.kind == 'carr' and x.rank == 1 and y.rank == 1", use = ["py_cdot"], viv = "py_cdot({x}, {y})", type = "CNUM" },
  { if = "x.kind == 'carr' or y.kind == 'carr'", refuse = "{name} of {x.words} and {y.words}", hint = "Only two complex vectors; write the complex products out." },
  { if = "x.rank == 1 and y.rank == 1 and x.py == 'int' and y.py == 'int'", use = ["py_isum", "py_int_arr", "py_vmul"], viv = "py_isum(py_int_arr(py_vmul({x}, {y})))", type = "NUM_I", exactness = "exact", evidence = "integer products and sums, checked below 2^53" },
  { if = "x.rank == 1 and y.rank == 1", use = ["py_vdot"], viv = "py_vdot({x}, {y})", type = "NUM_F" },
  { if = "name in ['np.inner', 'np.vdot'] and x.arr and y.arr", refuse = "{name} of matrices", hint = "Write it with @ and transpose." },
  { if = "name == 'np.matmul' and not (x.arr and y.arr)", refuse = "np.matmul of a number", hint = "NumPy raises ValueError; use *." },
  { if = "x.py == 'int' and y.py == 'int'", refuse = "{name} of two integer operands", hint = "NumPy's integer products wrap at 2^63; make one of them float." },
  { if = "not (x.arr and y.arr)", viv = "{x:70} * {y:71}", type = "arr(x.rank if x.arr else y.rank) if x.arr or y.arr else num_of(x, y)", prec = "70" },
