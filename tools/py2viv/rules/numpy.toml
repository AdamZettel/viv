# refused with "the method `.m`". A positional argument (a.sum(0), an axis) is refused.

[[rule]]
id = "a.sum"
match = "a.sum(axis=None, *, keepdims=False)"
when = "(not axis.given or axis.syntax == 'Constant' and axis.lit == None) and (not keepdims.given or keepdims.syntax == 'Constant' and keepdims.lit == False)"
exactness = "exact"
evidence = "mapping.py:48 M.sum(): bitwise; as np.sum"
cases = [
  { if = "a.kind == 'unknown'", viv = "sum({a})", type = "NUM_F" },
  { if = "a.kind == 'carr'", refuse = "the sum of a complex array", hint = "Sum the real and imaginary parts." },
  { if = "a.py in ['int', 'bool']", use = ["py_isum"], viv = "py_isum({a})", type = "NUM_I" },
  { if = "a.py == 'mixed'", refuse = "the sum of a list mixing ints and floats", hint = "Python adds the ints exactly first; make them all floats." },
  { if = "in_grad", inexact = "np.sum left to right inside a differentiated def (Viv's grad cannot follow the pairwise recursion)", viv = "sum({a})", type = "NUM_F", exactness = "tolerance", rtol = 1e-13, atol = 1e-16, evidence = "as np.sum inside grad" },
  { if = "a.arr and a.rank >= 2 and a.f_order and not a.transposed", refuse = "{name} of a matrix NumPy may hold in a transpose's memory order", hint = "NumPy adds (or multiplies) a transpose, and what is computed elementwise from one, in memory order; the translation's transpose is a copy in row order. Reduce the untransposed array, or copy it in row order first (`.copy()`)." },
  { if = "a.arr and a.rank == 2 and a.transposed and not in_grad and a.py == 'float'", use = ["py_npsum"], viv = "py_npsum(transpose({a}))", type = "NUM_F" },
  { use = ["py_npsum"], viv = "py_npsum({a})", type = "NUM_F" },
]
