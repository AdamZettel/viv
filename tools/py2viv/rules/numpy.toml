# NumPy (and the math functions NumPy shares): py2viv's translation rules (format: ../RULES.md).
#
# Tried after builtins.toml. Within a name, rules are tried in file order; a pattern with `*`
# only refuses, and is tried after every rule spelled out for that name has declined. The
# evidence cites SUBSET.md's "What is exact" and the differential runs in ../results/
# (mapping.py unless another file is named); every rule's `tests` feed its generated
# differential test (check_rules.py).
#
# Parameters carry NumPy's names where NumPy accepts them as keywords (np.zeros(shape, dtype),
# np.roll(a, shift, axis)), and are positional-only (`/`) for NumPy's ufuncs, which take no
# keywords for their operands. An argument no parameter takes is refused (RULES.md, "Binding").
#
# The result's type follows NumPy's dtype: an int array stays an int array where NumPy keeps
# int64 (np.abs, np.maximum, np.cumsum, ...), and becomes float where NumPy's ufunc gives
# float64 (np.sqrt, np.floor, np.hypot, ...). A Bool array into a ufunc (float16 in NumPy) and
# an integer power or remainder (wrap-around, 0 for a zero divisor) are refused.

# ---------------------------------------------------------------- constructors

[[rule]]
id = "np.array"
match = "np.array(object, dtype=None)"
params = { dtype = "dtype" }
exactness = "exact"
evidence = "mapping.py:51 np.array of a comprehension: bitwise; a literal or a copy"
cases = [
  { eval = [] },
  { keywords = ["dtype"], refuse = "{name}(..., {kw}=)", hint = "Drop it." },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64', 'complex', 'np.complex128']", refuse = "dtype={dtype}", hint = "Viv arrays hold float64 (or complex); NumPy would round or wrap the entries to this dtype." },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp'] and dtype in ['complex', 'np.complex128'] and object.kind != 'carr'", refuse = "np.array(..., dtype=complex) of real numbers", hint = "Write the entries as complex numbers (1.0 + 0j)." },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp'] and dtype in ['complex', 'np.complex128']", viv = "{object}", type = "T('carr', object.rank, 'complex', 'nd')", prec = "object.prec" },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp'] and dtype in ['int', 'np.int64'] and object.py != 'int'", refuse = "np.array(..., dtype=int) of floats", hint = "NumPy truncates each entry; write the ints." },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp'] and object.kind == 'carr' and dtype != None", refuse = "np.array(..., dtype={dtype}) of complex numbers", hint = "NumPy discards the imaginary parts (with a warning); take .real." },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp'] and object.kind == 'carr'", viv = "{object}", type = "T('carr', object.rank, 'complex', 'nd')", prec = "object.prec" },
  { if = "object.syntax in ['List', 'Tuple', 'ListComp']", viv = "{object}", type = "T('arr', object.rank, 'float' if dtype in ['float', 'np.float64'] else ('int' if dtype in ['int', 'np.int64'] else object.py), 'nd')", prec = "object.prec" },
  { if = "not object.arr", refuse = "{name} of {object.words}", hint = "Pass an array." },
  { if = "object.kind == 'carr'", refuse = "copying a complex array", hint = "Allocate czeros(n) and copy in a loop." },
  { if = "dtype in ['complex', 'np.complex128']", refuse = "np.array(a, dtype=complex) of a real array", hint = "Allocate czeros(n) and copy in a loop." },
  { if = "dtype in ['int', 'np.int64'] and object.py not in ['int', 'bool']", refuse = "np.array(a, dtype=int) of {object.words} of floats", hint = "NumPy truncates each entry toward zero; convert them in a loop with int(...)." },
  { use = ["py_copy"], viv = "py_copy({object})", type = "T('arr', object.rank, 'float' if dtype in ['float', 'np.float64'] else ('int' if dtype in ['int', 'np.int64'] else object.py), 'nd')" },
]
tests = [{ object = [[1.0, 2.0], [3.0, 4.0]] }, { object = [1, 2, 3] }, { object = [1, 2, 3], dtype = "float" }, { object = [1.5, 2.5], dtype = "float" }]

[[rule]]
id = "np.asarray"
match = "np.asarray(a, dtype=None)"
params = { dtype = "dtype" }
exactness = "exact"
evidence = "the same array (NumPy returns its argument when it is an array of that dtype), or a copy of a list"
cases = [
  { eval = [] },
  { keywords = ["dtype"], refuse = "{name}(..., {kw}=)", hint = "Drop it." },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64']", refuse = "dtype={dtype}", hint = "Viv arrays hold float64 (or complex); NumPy would round or wrap the entries to this dtype." },
  { if = "a.syntax in ['List', 'Tuple', 'ListComp'] and dtype in ['int', 'np.int64'] and a.py != 'int'", refuse = "np.asarray(..., dtype=int) of floats", hint = "NumPy truncates each entry; write the ints." },
  { if = "a.syntax in ['List', 'Tuple', 'ListComp'] and a.kind == 'carr' and dtype != None", refuse = "np.asarray(..., dtype={dtype}) of complex numbers", hint = "NumPy discards the imaginary parts (with a warning); take .real." },
  { if = "a.syntax in ['List', 'Tuple', 'ListComp'] and a.kind == 'carr'", viv = "{a}", type = "T('carr', a.rank, 'complex', 'nd')", prec = "a.prec" },
  { if = "a.syntax in ['List', 'Tuple', 'ListComp']", viv = "{a}", type = "T('arr', a.rank, 'float' if dtype in ['float', 'np.float64'] else ('int' if dtype in ['int', 'np.int64'] else a.py), 'nd')", prec = "a.prec" },
  { if = "not a.arr", refuse = "{name} of {a.words}", hint = "Pass an array." },
  { if = "a.kind == 'carr' and dtype == None and a.container == 'nd'", viv = "{a}", type = "a", prec = "a.prec" },
  { if = "a.kind == 'carr'", refuse = "copying a complex array", hint = "Allocate czeros(n) and copy in a loop." },
  { if = "dtype in ['int', 'np.int64'] and a.py not in ['int', 'bool']", refuse = "np.asarray(a, dtype=int) of {a.words} of floats", hint = "NumPy truncates each entry toward zero; convert them in a loop with int(...)." },
  { if = "a.container == 'nd' and (dtype == None or (dtype in ['float', 'np.float64'] and a.py == 'float') or (dtype in ['int', 'np.int64'] and a.py == 'int'))", viv = "{a}", type = "a", prec = "a.prec" },
  { use = ["py_copy"], viv = "py_copy({a})", type = "T('arr', a.rank, 'float' if dtype in ['float', 'np.float64'] else ('int' if dtype in ['int', 'np.int64'] else a.py), 'nd')" },
]
tests = [{ a = [[1.0, 2.0], [3.0, 4.0]] }, { a = [1, 2, 3] }, { a = [1, 2, 3], dtype = "float" }]

[[rule]]
id = "np.zeros"
match = ["np.zeros(shape, dtype=None)", "np.empty(shape, dtype=None)"]
params = { shape = "shape", dtype = "dtype" }
exactness = "exact"
evidence = "mapping.py:18 np.zeros(3), np.zeros((2, 2)): bitwise"
note = "np.empty is zeros, which NumPy's uninitialized memory is allowed to be."
cases = [
  { eval = ["shape"] },
  { keywords = ["dtype"], refuse = "{name}(..., {kw}=)", hint = "Drop it." },
  { if = "not shape.dims_int", refuse = "{name} of a size that is not an int", hint = "NumPy raises TypeError; pass ints." },
  { if = "dtype in ['complex', 'np.complex128'] and shape.ndims > 4", refuse = "an array of rank {shape.ndims}", hint = "Viv arrays have rank 1 to 4." },
  { if = "dtype in ['complex', 'np.complex128']", viv = "czeros({sizes(shape)})", type = "T('carr', shape.ndims, 'complex', 'nd')" },
  { if = "dtype not in [None, 'float', 'np.float64', 'int', 'np.int64', 'bool', 'np.bool_']", refuse = "dtype={dtype}", hint = "Viv arrays hold float64 (or complex)." },
  { if = "shape.ndims > 4", refuse = "an array of rank {shape.ndims}", hint = "Viv arrays have rank 1 to 4." },
  { viv = "zeros({sizes(shape)})", type = "T('arr', shape.ndims, 'int' if dtype in ['int', 'np.int64'] else ('bool' if dtype in ['bool', 'np.bool_'] else 'float'), 'nd')" },
]
tests = [{ shape = 3 }, { shape = [2, 2] }, { shape = 3, dtype = "int" }, { shape = 2, dtype = "complex" }]

