evidence = "check_rules.py's generated cases: vectors (each a row) and matrices"
cases = [
  { eval = ["seq"] },
  { if = "seq_n(seq) == 0", refuse = "{name} of no arrays", hint = "NumPy raises ValueError; pass at least one array." },
  { if = "seq_kinds(seq) not in [['arr'], ['carr']]", refuse = "{name} of values that are not all real arrays or all complex arrays", hint = "Stack arrays of one kind." },
  { if = "seq_py(seq) == 'mixed'", refuse = "{name} of a list mixing ints and floats", hint = "Make them all floats." },
  { if = "seq_ranks(seq) not in [[1], [2], [1, 2]]", refuse = "{name} of arrays of rank {seq_ranks(seq)[-1]}", hint = "Only vectors and matrices are stacked (Viv's vcat)." },
  { viv = "vcat({seq})", type = "T(seq_kinds(seq)[0], 2, seq_py(seq), 'nd')" },
]
tests = [{ seq = [[1.0, 2.0, 3.0], [4.0, -0.5, 6.0]] }, { seq = [[[1, 2], [3, 4]], [5, 6]] }]

