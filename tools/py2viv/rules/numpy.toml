# ---------------------------------------------------------------- rearrangements

[[rule]]
id = "np.roll"
match = "np.roll(a, shift, axis=None)"
exactness = "exact"
evidence = "mapping.py:40 np.roll(x, 2), np.roll(x, -1): bitwise (rank 1)"
cases = [
  { eval = ["a", "shift"] },
  { keywords = ["axis", "shift"], refuse = "np.roll(..., {kw}=)", hint = "Drop it." },
  { eval = ["axis"] },
  { if = "not a.arr or a.kind == 'carr'", refuse = "np.roll of {a.words}", hint = "Pass a real array." },
  { if = "shift.kind != 'num' or shift.py != 'int'", refuse = "np.roll by a shift that is not an int", hint = "NumPy raises TypeError; pass an int." },
  { if = "axis.given and (axis.lit == None or axis.lit < 0 or axis.lit >= a.rank)", refuse = "np.roll with axis={axis.code}", hint = "Pass the axis as a literal from 0 to {a.rank - 1}." },
  { if = "not axis.given and a.rank != 1", refuse = "np.roll of a matrix without axis (NumPy rolls it flat)", hint = "Pass axis=.", gap = "R10" },
  { if = "not axis.given", viv = "roll({a}, {shift})", type = "T(a.kind, a.rank, a.py, 'nd')" },
  { viv = "roll({a}, {shift}, {axis})", type = "T(a.kind, a.rank, a.py, 'nd')" },
]
tests = [{ a = [1.0, 2.0, 3.0, 4.0], shift = 2 }, { a = [1.0, 2.0, 3.0, 4.0], shift = -1 }, { a = [[1.0, 2.0], [3.0, 4.0]], shift = 1, axis = 1 }]

