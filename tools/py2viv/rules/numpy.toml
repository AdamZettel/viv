  { if = "y.kind == 'carr'", use = ["py_cbmulrc"], viv = "py_cbmulrc({x}, {y})", type = "rt" },
  { if = "same_shape(x, y) and rt.py == 'int'", use = ["py_int_arr"], viv = "py_int_arr({x:70} {op} {y:71})", type = "rt" },
  { if = "same_shape(x, y) and op in ['+', '-']", viv = "{x:60} {op} {y:61}", type = "rt", prec = "60" },
