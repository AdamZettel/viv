# Imports outside the numeric subset (see RULES.md, "Modules").
#
# `import X` and `from X import y` of any module but math, numpy (numpy.linalg, numpy.fft),
# viv, typing, collections.abc and __future__ are refused at the import, and again at each use
# of a name the import bound. The hint is the one below for the module's top-level name, or
# "`X` is not in the numeric subset (math, numpy, viv)." for a module not listed.

[refused_module_hint]
scipy = "SciPy is not in the numeric subset; write the algorithm, or call the Viv builtin that does it (eig_sym, lin_solve, simpson, ...)."
torch = "py2viv does not translate PyTorch model code; write it in NumPy."
random = "Python's random module is not mapped; np.random.seed(s) with np.random.rand, randint, choice, shuffle, ... or rng = np.random.default_rng(seed) translate draw for draw (lib/nprandom)."
sys = "the numeric subset has no system access; drop it."
