viv = '''
#| NumPy's _var of f seen as [before, along, after] (s): the mean of each entry of the result,
#| kept, subtracted from every term, squared, summed in the same order, over along.
def py_var_fl(f: Arr, s: Arr) {
    before = s[0]
    along = s[1]
    after = s[2]
    mu = py_sum_fl(f, s) / along
    x = zeros(len(f))
    for o to before {
        for j to along {
            for i to after {
                x[(o * along + j) * after + i] = f[(o * along + j) * after + i] - mu[o * after + i]
            }
        }
    }
    return py_sum_fl(x * x, s) / along
}
'''

