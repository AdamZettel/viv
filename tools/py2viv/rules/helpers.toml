# ---------------------------------------------------------------- masks and integer indices
#
# `a[m]` with a Bool array m, `a[idx]` with an integer array, `A[:, idx]`, `A[I, J]`: NumPy
# gives a new array (a copy), gathered in row-major order of the result; a store through one
# (`a[m] = v`, `a[idx] = v`) writes the entries in that order, so of repeated indices the
# last write wins, and `a[idx] += v` reads a[idx] once, adds, and writes back (a repeated
# index is incremented once). Viv's take and put gather and scatter by flat index in that
# order.

[helper.py_ixchk]
group = "prelude"
stops = ["IndexError: index"]
viv = '''
#| One entry of an integer index array on an axis of length n: a negative one counts from the
#| end; NumPy raises IndexError for one out of bounds.
def py_ixchk(i, n) {
    j = i
    if j < 0 {
        j = j + n
    }
    if j < 0 or j >= n {
        stop("IndexError: index")
    }
    return j
}
'''

[helper.py_nzflat]
group = "prelude"
deps = ["py_flat"]
viv = '''
#| The flat indices of the nonzero entries of m, in order (a NaN is nonzero, -0.0 is zero).
def py_nzflat(m: Arr) {
    f = py_flat(m)
    c = 0
    for i to len(f) {
        if f[i] != 0 {
            c += 1
        }
    }
    r = zeros(c)
    c = 0
    for i to len(f) {
        if f[i] != 0 {
            r[c] = i
            c += 1
        }
    }
    return r
}
'''

[helper.py_mchk]
