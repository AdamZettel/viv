[helper.py_reshape]
group = "numeric"
deps = ["py_shaped", "py_flat"]
viv = '''
#| np.reshape(a, d) in row-major order: a's entries in the shape d, where one length may be
#| negative (NumPy 1.24 reads any negative length as -1: the one that makes the sizes agree).
#| NumPy raises ValueError where they cannot agree.
def py_reshape(a: Arr, d: Arr) {
    e = copy(d)
    known = 1
    free = -1
    for i to len(e) {
        if e[i] < 0 {
            if free >= 0 {
                stop("ValueError: can only specify one unknown dimension")
            }
            free = i
        }
        else {
            known = known * e[i]
        }
    }
    if free >= 0 {
        if known == 0 or numel(a) % known != 0 {
            stop("ValueError: cannot reshape the array into that shape")
        }
        e[free] = numel(a) / known
        known = numel(a)
    }
    if known != numel(a) {
        stop("ValueError: cannot reshape the array into that shape")
    }
    return py_shaped(py_flat(a), e)
}
'''

[helper.py_meshgrid]
group = "numeric"
viv = '''
#| np.meshgrid(x, y): X repeats x along each row and Y repeats y down each column, both
#| len(y) x len(x) (indexing='xy', ij = 0); or both len(x) x len(y), X[i, j] = x[i] and
#| Y[i, j] = y[j] (indexing='ij', ij = 1).
def py_meshgrid(x: Arr, y: Arr, ij) {
    nx = len(x)
    ny = len(y)
    if ij == 1 {
        X = zeros(nx, ny)
        Y = zeros(nx, ny)
        for i to nx {
            for j to ny {
                X[i, j] = x[i]
                Y[i, j] = y[j]
            }
        }
        return X, Y
    }
    X = zeros(ny, nx)
    Y = zeros(ny, nx)
    for i to ny {
        for j to nx {
            X[i, j] = x[j]
            Y[i, j] = y[i]
        }
    }
    return X, Y
}
'''

