# ---------------------------------------------------------------- reductions along an axis
#
# NumPy reduces a C-ordered array along axis k as a loop over the entries before the axis
# (`before`), along it (`along`) and after it (`after`), with a flat index
# (o * along + j) * after + i. Checked against NumPy 1.24 on random arrays of ranks 1 to 3
# (the study of 2026-09-27, tools/py2viv/results/axis_order.txt):
#   - a sum along the last axis (every axis after k of length 1) is py_blk per output entry;
#   - a sum along any other axis adds the slabs in order, from 0.0, entry by entry;
#   - np.mean divides that by `along`; np.var subtracts the mean (kept per entry), squares, and
#     sums again in the same order, over `along`;
#   - max, min, argmax and argmin do not depend on the order; prod multiplies in order; cumsum
#     runs along the axis from its first entry.
# `k` is the axis (0 ... rank - 1), or -1 for every axis at once (the array flat); `keep` is 1
# for keepdims=True.

[helper.py_ax]
group = "numeric"
viv = '''
#| The sizes around axis k of a (k = -1: every axis, the array flat): [before, along, after].
def py_ax(a: Arr, k) {
    d = shape(a)
    if k < 0 {
        return [1, numel(a), 1]
    }
    before = 1
    for i to k {
        before = before * d[i]
    }
    after = 1
    for i from k + 1 to len(d) {
        after = after * d[i]
    }
    return [before, d[k], after]
}
'''

