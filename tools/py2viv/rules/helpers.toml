[helper.py_rslice]
group = "lists"
viv = '''
#| a[lo:hi:st] of a vector with a negative step st: the entries from lo down to (not including)
#| hi, a new array. The bounds are read as Python's slice.indices reads them for a negative step
#| (CPython's PySlice_AdjustIndices): a missing lo is the last entry, a missing hi is before the
#| first, a negative one counts from the end, and one past either end is clamped.
def py_rslice(a: Arr, has_lo, lo, has_hi, hi, st) {
    n = len(a)
    s = n - 1
    if has_lo != 0 {
        s = lo
        if s < 0 {
            s = s + n
            if s < 0 {
                s = -1
            }
        }
        else if s >= n {
            s = n - 1
        }
    }
    e = -1
    if has_hi != 0 {
        e = hi
        if e < 0 {
            e = e + n
            if e < 0 {
                e = -1
            }
        }
        else if e >= n {
            e = n - 1
        }
    }
    m = 0
    if e < s {
        m = floor((s - e - 1) / (0 - st)) + 1
    }
    r = zeros(m)
    for k to m {
        r[k] = a[s + k * st]
    }
    return r
}
'''

