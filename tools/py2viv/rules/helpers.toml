[helper.py_npg_choice]
group = "nprandom"
deps = ["npr_generator", "py_npr_pcheck", "py_size"]
viv = '''
#| Generator.choice's population checks (its messages), and the indices it draws: n of them
#| (n = 1 for a single draw), with replace and p as np.random.choice, without replacement by
#| Floyd's algorithm and a shuffle (do_shuffle 1) or a partial shuffle of a large population.
def py_npg_pop_int(pop, n) {
    if pop <= 0 and n != 0 {
        stop("ValueError: a must be a positive integer unless no samples are taken")
    }
    return pop
}

def py_npg_pop_arr(a: Arr, n) {
    if len(a) == 0 and n != 0 {
        stop("ValueError: a cannot be empty unless no samples are taken")
    }
    return len(a)
}

def py_npg_choice_idx(st: [Int], pop, n, replace, p: Arr, has_p, do_shuffle) {
    if has_p == 1 {
        py_npr_pcheck(p, pop, 1)
    }
    if replace == 1 {
        if has_p == 1 {
            cdf = npr_lg_cdf(p)
            u = zeros(py_size(n))
            for i to n {
                u[i] = npr_pcg_double(st)
            }
            idx = zeros(n)
            for i to n {
                idx[i] = npr_lg_search(cdf, u[i])
            }
            return idx
        }
        idx = zeros(py_size(n))
        for i to n {
            idx[i] = npr_gn_bounded(st, pop - 1)
        }
        return idx
    }
    if n > pop {
        stop("ValueError: Cannot take a larger sample than population when replace is False")
    }
    if n < 0 {
        stop("ValueError: negative dimensions are not allowed")
    }
    if has_p == 1 {
        py_npr_nonzero_check(p, n)
        q = p * 1.0
        found = zeros(n)
        m = 0
        while m < n {
            x = zeros(n - m)
            for i to len(x) {
                x[i] = npr_pcg_double(st)
            }
            m = py_npr_unique_round(q, found, m, x)
        }
        return found
    }
    return npr_gn_choice_noreplace(st, pop, n, do_shuffle)
}

#| Generator.choice(a) of an int a: one index; of n; of a vector a: one entry, n entries.
def py_npg_choice1(st: [Int], pop, replace, p: Arr, has_p, do_shuffle) {
    idx = py_npg_choice_idx(st, py_npg_pop_int(pop, 1), 1, replace, p, has_p, do_shuffle)
    return idx[0]
}

def py_npg_choice_n(st: [Int], pop, n, replace, p: Arr, has_p, do_shuffle) {
    return py_npg_choice_idx(st, py_npg_pop_int(pop, n), n, replace, p, has_p, do_shuffle)
}

def py_npg_choice_a1(st: [Int], a: Arr, replace, p: Arr, has_p, do_shuffle) {
    idx = py_npg_choice_idx(st, py_npg_pop_arr(a, 1), 1, replace, p, has_p, do_shuffle)
    return a[idx[0]]
}

def py_npg_choice_a(st: [Int], a: Arr, n, replace, p: Arr, has_p, do_shuffle) {
    idx = py_npg_choice_idx(st, py_npg_pop_arr(a, n), n, replace, p, has_p, do_shuffle)
    out = zeros(len(idx))
    for i to len(idx) {
        out[i] = a[idx[i]]
    }
    return out
}
'''

# ---------------------------------------------------------------- lists (funcs.py)
#
# Python's list operations that Viv has no builtin for: a stable sort by keys (sorted with
# key= or reverse=, list.sort), and the rows and columns it reads.

[helper.py_msort]
group = "lists"
viv = '''
#| The indices p ordered by the keys k[p[i]], stably, as Python's sorted orders its items: by
#| `<`, equal keys in their order; with rev, descending, and equal keys still in their order
#| (sorted(..., reverse=True)). A merge sort: every stable sort of the same keys gives the same
#| order, so this is Python's Timsort's. A NaN key makes `<` inconsistent, and the order then
#| depends on the algorithm: the run stops.
def py_msort(k: Arr, p: Arr, rev) {
    n = len(p)
    for i to n {
        if k[p[i]] != k[p[i]] {
            stop("py2viv: sorting by a NaN (Python's order then depends on its sort algorithm)")
        }
    }
    a = p * 1.0
    b = zeros(n)
    w = 1
    while w < n {
        lo = 0
        while lo < n {
            mid = min(lo + w, n)
            hi = min(lo + 2 * w, n)
            i = lo
            j = mid
            o = lo
            while o < hi {
                right = false
                if i >= mid {
                    right = true
                }
                else if j < hi {
                    if rev != 0 {
                        right = k[a[j]] > k[a[i]]
                    }
                    else {
                        right = k[a[j]] < k[a[i]]
                    }
                }
                if right {
                    b[o] = a[j]
                    j += 1
                }
                else {
                    b[o] = a[i]
                    i += 1
                }
                o += 1
            }
            lo = hi
        }
        t = a
        a = b
        b = t
        w = w * 2
    }
    return a
}
'''

