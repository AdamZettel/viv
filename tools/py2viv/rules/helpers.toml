# ---------------------------------------------------------------- broadcasting
#
# NumPy broadcasts two arrays of different shapes: aligned at their last axes, each pair of
# lengths must be equal or one of them 1, and the result takes the larger. Each entry of the
# result is one operation (+, -, *, /, a comparison, np.maximum, ...) on the entries it
# reads, so a broadcast result is exact when the operands are expanded first and then
# combined entry by entry: py_bto copies the entries (`take`), and Viv's elementwise
# operation rounds each entry once, as NumPy's loop does (no fused multiply-add: the C
# backend compiles with FP_CONTRACT OFF, wasm has no fused instruction, and the interpreter
# is Rust, which does not contract). Where two shapes do not broadcast, NumPy raises
# ValueError and the run stops with the start of NumPy's message (`stops`: diff.py compares
# a helper's stop with the start of Python's line).

[helper.py_bdims]
group = "prelude"
stops = ["ValueError: operands could not be broadcast together with shapes"]
viv = '''
#| The shape NumPy broadcasts two shapes da and db to (aligned at the last axis, a length 1
#| stretched); the run stops where NumPy raises ValueError.
def py_bdims(da: Arr, db: Arr) {
    n = len(da)
    if len(db) > n {
        n = len(db)
    }
    e = zeros(n)
    for i to n {
        x = 1
        y = 1
        if i >= n - len(da) {
            x = da[i - n + len(da)]
        }
        if i >= n - len(db) {
            y = db[i - n + len(db)]
        }
        if x == y or y == 1 {
            e[i] = x
        }
        else {
            if x == 1 {
                e[i] = y
            }
            else {
                stop("ValueError: operands could not be broadcast together with shapes")
            }
        }
    }
    return e
}
'''

[helper.py_bdimsq]
group = "prelude"
deps = ["py_bdims"]
viv = '''
#| py_bdims for `==` and `!=`, where NumPy 1.24 gives one False (with a DeprecationWarning)
#| for shapes that do not broadcast and NumPy 2 raises: the run stops.
def py_bdimsq(da: Arr, db: Arr) {
    n = len(da)
    if len(db) > n {
        n = len(db)
    }
    for i to n {
        if i >= n - len(da) and i >= n - len(db) {
            x = da[i - n + len(da)]
            y = db[i - n + len(db)]
            if x != y and x != 1 and y != 1 {
                stop("py2viv: `==` or `!=` of arrays whose shapes do not broadcast (NumPy 1.24 gives one False with a DeprecationWarning, NumPy 2 raises ValueError)")
            }
        }
    }
    return py_bdims(da, db)
}
'''

