[helper.py_clip]
group = "numeric"
viv = '''
#| np.clip(x, lo, hi) of a number, as NumPy's clip loop: a NaN x stays, a NaN bound is
#| ignored, and x is replaced by a bound unless x > lo (then unless x < hi), so of two
#| equal zeros the bound's sign wins.
def py_clip(x, lo, hi) {
    m = x
    if x == x and lo == lo and not (x > lo) {
        m = lo
    }
    r = m
    if m == m and hi == hi and not (m < hi) {
        r = hi
    }
    return r
}
'''

[helper.py_clipv]
group = "numeric"
viv = '''
#| np.clip(a, lo, hi) of an array and two numbers, entry by entry as py_clip.
def py_clipv(a: Arr, lo, hi) {
    m = a * 1.0
    if lo == lo {
        L = a * 0.0
        fill(L, lo)
        m = where(a != a, a, where(a > L, a, L))
    }
    r = m
    if hi == hi {
        H = a * 0.0
        fill(H, hi)
        r = where(m != m, m, where(m < H, m, H))
    }
    return r
}
'''

