[helper.py_removeprefix]
group = "strings"
viv = '''
#| Python's str.removeprefix: the string without the prefix when it starts with it.
def py_removeprefix(s, p) {
    if startswith(s, p) {
        return s[len(p):]
    }
    return s
}
'''

[helper.py_removesuffix]
group = "strings"
viv = '''
#| Python's str.removesuffix: an empty suffix leaves the string as it is.
def py_removesuffix(s, p) {
    if len(p) > 0 and endswith(s, p) {
        return s[:len(s) - len(p)]
    }
    return s
}
'''

[helper.py_excline]
group = "strings"
viv = '''
#| The last line of the traceback of an exception raised with a message computed at run time:
#| the type alone when the message is empty, as Python writes it.
def py_excline(t, m) {
    if len(m) > 0 {
        return t + ": " + m
    }
    return t
}
'''
