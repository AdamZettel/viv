viv = '''
#| np.max (big = 1) or np.min (big = 0) of a along axis k: NaN if any entry is NaN, else the
#| largest (+0 over -0) or smallest (-0 under +0); NumPy raises for an empty axis.
def py_max_ax(a: Arr, k, keep, big) {
    f = py_flat(a)
    s = py_ax(a, k)
    before = s[0]
    along = s[1]
    after = s[2]
    r = zeros(before * after)
    if along == 0 and before * after > 0 {
        if big == 1 {
            stop("ValueError: zero-size array to reduction operation maximum which has no identity")
        }
        stop("ValueError: zero-size array to reduction operation minimum which has no identity")
    }
    for o to before {
        for i to after {
            m = f[o * along * after + i]
            for j from 1 to along {
                x = f[(o * along + j) * after + i]
                if m != m or x != x {
                    m = 0.0 / 0.0
                }
                else {
                    if big == 1 {
                        m = py_zmax2(m, x)
                    }
                    else {
                        m = py_zmin2(m, x)
                    }
                }
