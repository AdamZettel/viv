[helper.py_arange]
group = "prelude"
viv = '''
#| np.arange(start, stop, step), as NumPy fills it: ceil((stop - start) / step) entries,
#| entry k = start + k * delta with delta = (start + step) - start.
def py_arange(start, stop_, step) {
    if step == 0 {
        stop("ZeroDivisionError: division by zero")
    }
    if not (abs((stop_ - start) / step) < 1.0 / 0.0) {
        stop("py2viv: np.arange of a length that is not finite (NumPy raises ValueError)")
    }
    n = max(ceil((stop_ - start) / step), 0)
    a = zeros(n)
    delta = (start + step) - start
    for k to n {
        a[k] = start + k * delta
    }
    return a
}
'''

[helper.py_eye]
group = "prelude"
viv = '''
#| np.eye(n, k=d): ones on the d-th diagonal.
def py_eye(n, d) {
    E = zeros(n, n)
    for i to n {
        j = i + d
        if j >= 0 and j < n {
            E[i, j] = 1
        }
    }
    return E
}
'''

[helper.py_diag]
group = "prelude"
viv = '''
#| np.diag(v) for a vector: the square matrix with v on its diagonal.
def py_diag(v: Arr) {
    n = len(v)
    D = zeros(n, n)
    for i to n {
        D[i, i] = v[i]
    }
    return D
}
'''

[helper.py_diagonal]
group = "prelude"
viv = '''
#| np.diag(A) for a matrix: its diagonal, as a vector.
def py_diagonal(A: Arr) {
    n = min(shape(A)[0], shape(A)[1])
    d = zeros(n)
    for i to n {
        d[i] = A[i, i]
    }
    return d
}
'''

[helper.py_trace]
group = "prelude"
deps = ["py_diagonal", "py_pw"]
viv = '''
#| np.trace(A): NumPy's pairwise sum of the diagonal.
def py_trace(A: Arr) {
    d = py_diagonal(A)
    return py_pw(d, 0, len(d))
}
'''

[helper.py_outer]
group = "prelude"
viv = '''
#| np.outer(u, v).
def py_outer(u: Arr, v: Arr) {
    M = zeros(len(u), len(v))
    for i to len(u) {
        for j to len(v) {
            M[i, j] = u[i] * v[j]
        }
    }
    return M
}
'''

[helper.py_cumsum]
group = "prelude"
viv = '''
#| np.cumsum(a) of a vector: entry i is entry i - 1 plus a[i], from a[0] itself (so a -0.0
#| first stays -0.0).
def py_cumsum(a: Arr) {
    c = zeros(len(a))
    if len(a) == 0 {
        return c
    }
    s = a[0]
    c[0] = s
    for i from 1 to len(a) {
        s += a[i]
        c[i] = s
    }
    return c
}
'''

[helper.py_prod]
group = "prelude"
deps = ["py_flat"]
viv = '''
#| np.prod(a): the product of every entry, left to right.
def py_prod(a: Arr) {
    f = py_flat(a)
    p = 1.0
    for i to len(f) {
        p *= f[i]
    }
    return p
}
'''

[helper.py_argmax]
group = "prelude"
deps = ["py_flat"]
viv = '''
#| np.argmax(a): the flat index of the first largest entry.
def py_argmax(a: Arr) {
    f = py_flat(a)
    k = 0
    if f[0] != f[0] {
        return 0
    }
    for i from 1 to len(f) {
        if f[i] != f[i] {
            return i
        }
        if f[i] > f[k] {
            k = i
        }
    }
    return k
}
'''

[helper.py_argmin]
group = "prelude"
deps = ["py_flat"]
viv = '''
#| np.argmin(a): the flat index of the first smallest entry.
def py_argmin(a: Arr) {
    f = py_flat(a)
    k = 0
    if f[0] != f[0] {
        return 0
    }
    for i from 1 to len(f) {
        if f[i] != f[i] {
            return i
        }
        if f[i] < f[k] {
            k = i
        }
    }
    return k
}
'''

[helper.py_mean]
group = "prelude"
deps = ["py_npsum"]
viv = '''
#| np.mean(a): NumPy's pairwise sum over numel(a).
