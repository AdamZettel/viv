# The Viv helper defs a translation may call (format: ../RULES.md, "Helpers").
#
# A rule names a helper in a case's `use` list; py2viv.py's own translation of operators,
# printing and literals uses them by name too. A translation carries each helper it used, and
# the helpers their `deps` name, once, in the order of this file.

# ---------------------------------------------------------------- the prelude
#
# Helpers the translation may call, emitted only when used (with the helpers their `deps`
# name), in the order of this file. Each is plain Viv, so all three engines run the same
# code. The calling-convention adapters (py_sort, py_solve, py_cholesky, py_eigvalsh,
# py_fft_*, py_inv) exist because the Viv builtin writes into an argument or sorts in place,
# where NumPy returns a new array.

[helper.py_b01]
group = "prelude"
viv = '''
#| A Bool as 1 or 0.
def py_b01(c) {
    if c {
        return 1
    }
    return 0
}
'''

[helper.py_iota]
group = "prelude"
viv = '''
#| 0, 1, ..., n - 1.
def py_iota(n) {
    a = zeros(n)
    for i to n {
        a[i] = i
    }
    return a
}
'''

[helper.py_flat]
group = "prelude"
deps = ["py_iota"]
viv = '''
#| Every entry of a real array, row-major, as a vector (a copy).
def py_flat(a: Arr) {
    return take(a, py_iota(numel(a)))
}
'''

[helper.py_round]
group = "prelude"
deps = ["py_rint"]
viv = '''
#| Python's round(x): halves go to the even neighbor (round(2.5) is 2, round(-2.5) is -2).
def py_round(x) {
    if x != x {
        stop("{E:round_nan}")
    }
    if abs(x) == 1.0 / 0.0 {
        stop("{E:round_inf}")
    }
    return py_rint(x) + 0.0
}
'''

[helper.py_rint]
group = "prelude"
viv = '''
#| Round half to even (C's rint, NumPy's round); a zero result comes back +0.
def py_rint(x) {
    if abs(x) >= 4503599627370496 or x != x {
        return x
    }
    f = floor(x)
    d = x - f
    if d > 0.5 {
        return f + 1
    }
    if d < 0.5 {
        return f
    }
    if f % 2 == 0 {
        return f
    }
    return f + 1
}
'''

[helper.py_npround]
group = "prelude"
deps = ["py_rint"]
viv = '''
#| np.round(x) of a number: half to even, a float, -0.0 kept (np.round(-0.4) is -0.0).
def py_npround(x) {
    r = py_rint(x)
    if r == 0 {
        return 0.0 * x
    }
    return r
}
'''

[helper.py_trunc]
group = "prelude"
viv = '''
#| Python's int(x) on a float: toward zero (int(-2.5) is -2).
def py_trunc(x) {
    if x != x {
        stop("{E:int_nan}")
    }
    if abs(x) == 1.0 / 0.0 {
        stop("{E:int_inf}")
    }
    if x < 0 {
        return ceil(x) + 0.0
    }
    return floor(x)
}
'''

[helper.py_sign]
group = "prelude"
viv = '''
#| np.sign of a number: -1, 0 or 1 (and nan for nan).
def py_sign(x) {
    if x > 0 {
        return 1
    }
    if x < 0 {
        return -1
    }
    if x == 0 {
        return 0.0
