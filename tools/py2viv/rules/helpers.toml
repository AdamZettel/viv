deps = ["py_iota"]
viv = '''
#| The entries of a complex vector f, row-major, as a complex array of shape e (1 to 4
#| lengths).
def py_cshaped(f: CArr, e: Arr) {
    if len(e) == 1 {
        return f
    }
    if len(e) == 2 {
        z = czeros(e[0], e[1])
    }
    else {
        if len(e) == 3 {
            z = czeros(e[0], e[1], e[2])
        }
        else {
            z = czeros(e[0], e[1], e[2], e[3])
        }
    }
    put(z, py_iota(numel(z)), f)
    return z
}
'''

