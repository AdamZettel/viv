# ---------------------------------------------------------------- guards
#
# Where Python raises (or is exact) and a double would silently differ, the translation calls
# one of these, which stops the run (`stop`) with the traceback's last line as this CPython
# writes it ({E:key}, filled from py2viv.py's HOST_ERRORS), or with a py2viv message where
# Python would not raise at all but the translation cannot follow it exactly.

[helper.py_int]
group = "guards"
viv = '''
#| An int result, as Python's int: a -0.0 becomes 0 (an int has no sign on zero), and the run
#| stops at 2^53, past which a double no longer holds every integer (Python's int does).
def py_int(x) {
    if abs(x) >= 9007199254740992 {
        stop("py2viv: an integer reached 2^53; Python's int is exact there and a double is not")
    }
    return x + 0.0
}
'''

[helper.py_int_arr]
group = "guards"
viv = '''
#| An integer-array result: every entry below 2^53 in size (NumPy's int64 is exact to 2^63).
def py_int_arr(a: Arr) {
    if max(abs(a)) >= 9007199254740992 {
        stop("py2viv: an integer array entry reached 2^53; NumPy's int64 is exact there and a double is not")
    }
    return a + 0.0
}
'''

[helper.py_zero_f]
group = "guards"
viv = '''
#| 0.0 with the sign of w (C's copysign(0.0, w)).
def py_zero_f(w) {
    if w < 0 or (w == 0 and 1.0 / w < 0) {
        return -0.0
    }
    return 0.0
}
'''

[helper.py_fdm]
group = "guards"
deps = ["py_zero_f"]
viv = '''
#| Floored division (k = 0) or remainder (k = 1) of doubles, as CPython's float_divmod and
#| NumPy's npy_divmod compute them (fmod first, then the sign fix and the rounding fix).
def py_fdm(a, b, k) {
    m = mod(a, b)
    d = (a - m) / b
    if m != 0 {
        if (b < 0) != (m < 0) {
            m = m + b
            d = d - 1.0
        }
    }
    else {
        m = py_zero_f(b)
    }
    if k == 1 {
        return m
    }
    if d != 0 {
        f = floor(d)
        if d - f > 0.5 {
            f = f + 1.0
        }
        return f
    }
    return py_zero_f(a / b)
}
'''

