# ---------------------------------------------------------------- indexing
#
# Python's slice bounds (slice.indices with a positive step): a negative bound counts from the
# end, and a bound past either end is clamped, so no range is out of bounds. Viv's ranges need
# 0 <= lo <= hi <= n and stop otherwise, so each bound is normalized first.

[helper.py_lo]
group = "prelude"
viv = '''
#| A slice bound as Python reads it on an axis of length n: a negative one counts from the
#| end; the result is clamped to 0 ... n.
def py_lo(lo, n) {
    b = lo
    if b < 0 {
        b = b + n
        if b < 0 {
            b = 0
        }
    }
    if b > n {
        b = n
    }
    return b
}
'''

[helper.py_hi]
group = "prelude"
deps = ["py_lo"]
viv = '''
#| The end of the slice lo:hi on an axis of length n, as Python reads it, and never before
#| the start (Python's slice is then empty).
def py_hi(lo, hi, n) {
    b = py_lo(hi, n)
    a = py_lo(lo, n)
    if b < a {
        b = a
    }
    return b
}
'''

[helper.py_ix]
group = "prelude"
viv = '''
#| An index next to a slice, as NumPy reads it on an axis of length n: a negative one counts
#| from the end (one still out of bounds stops the run, as NumPy raises IndexError).
def py_ix(i, n) {
    if i < 0 {
        return i + n
    }
    return i
}
'''

[helper.py_fit]
group = "prelude"
viv = '''
#| A value stored into a slice or written back in place: NumPy broadcasts it into the target's
#| shape, and Viv stores only an array of exactly that shape, so the run stops unless the
#| shapes are equal (where NumPy cannot broadcast either, it raises ValueError).
def py_fit(v: Arr, s: Arr) {
    if any(shape(v) != shape(s)) {
        stop("py2viv: a value of another shape stored into a slice or an array in place (NumPy broadcasts it, or raises ValueError)")
    }
    return v
}
'''

