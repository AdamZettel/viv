#| with length 1 when keep is 1.
def py_rdims(a: Arr, k, keep) {
    d = shape(a)
    e = []
    for i to len(d) {
        if i == k or k < 0 {
            if keep == 1 {
                e = append(e, 1)
            }
        }
        else {
            e = append(e, d[i])
        }
    }
    return e
}
'''

