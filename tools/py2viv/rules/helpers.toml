[helper.py_npr_pcheck]
group = "nprandom"
deps = ["npr_legacy"]
viv = '''
#| choice's check of p (the same in RandomState and Generator, whose messages differ: gen is 1
#| for Generator's): its length, a NaN sum, a negative entry, a sum more than sqrt(eps) from 1.
def py_npr_pcheck(p: Arr, pop, gen) {
    if len(p) != pop {
        if gen == 1 {
            stop("ValueError: a and p must have same size")
        }
        stop("ValueError: 'a' and 'p' must have same size")
    }
    s = npr_kahan_sum(p)
    if s != s {
        stop("ValueError: probabilities contain NaN")
    }
    for i to len(p) {
        if p[i] < 0 {
            stop("ValueError: probabilities are not non-negative")
        }
    }
    if abs(s - 1.0) > 1.4901161193847656e-08 {
        stop("ValueError: probabilities do not sum to 1")
    }
    return 0
}

#| choice with p and without replacement, one round (np.unique with return_index, sorted):
#| x are the round's draws; the indices they pick, in order of first appearance, are added to
#| found after its first n_uniq entries, whose p q the round sets to 0 first. Returns the new
#| count. The caller draws len(x) = n - n_uniq doubles a round until it has n.
def py_npr_unique_round(q: Arr, found: Arr, n_uniq, x: Arr) {
    for i to n_uniq {
        q[found[i]] = 0.0
    }
    cdf = npr_lg_cdf(q)
    seen = zeros(len(q))
    m = n_uniq
    for i to len(x) {
        v = npr_lg_search(cdf, x[i])
        if seen[v] == 0 {
            seen[v] = 1
            found[m] = v
            m = m + 1
        }
    }
    return m
}

#| NumPy's check that p has at least n entries above 0.
def py_npr_nonzero_check(p: Arr, n) {
    nz = 0
    for i to len(p) {
        if p[i] > 0 {
            nz = nz + 1
        }
    }
    if nz < n {
        stop("ValueError: Fewer non-zero entries in p than size")
    }
    return 0
}
'''

[helper.py_npr_choice]
group = "nprandom"
deps = ["py_npr_st", "py_npr_permutation", "py_npr_pcheck", "py_size"]
viv = '''
#| np.random.choice's population checks: an int must be positive, an array not empty, unless
#| no samples are taken (n is the sample count; 1 for no size).
def py_npr_pop_int(pop, n) {
    if pop <= 0 and n != 0 {
        stop("ValueError: a must be greater than 0 unless no samples are taken")
    }
    return pop
}

def py_npr_pop_arr(a: Arr, n) {
    if len(a) == 0 and n != 0 {
        stop("ValueError: 'a' cannot be empty unless no samples are taken")
    }
    return len(a)
}

#| The indices np.random.choice draws: n of them (n = 1 for a single draw), from pop, with
#| replace 1 or 0, and p (checked) when has_p is 1.
def py_npr_choice_idx(pop, n, replace, p: Arr, has_p) {
    if has_p == 1 {
        py_npr_pcheck(p, pop, 0)
    }
    if replace == 1 {
        if has_p == 1 {
            cdf = npr_lg_cdf(p)
            u = zeros(py_size(n))
            st = py_npr_st()
            for i to n {
                u[i] = npr_mt_double(st)
            }
            idx = zeros(n)
            for i to n {
                idx[i] = npr_lg_search(cdf, u[i])
            }
            return idx
        }
        idx = zeros(py_size(n))
        if n > 0 {
            st = py_npr_st()
            for i to n {
                idx[i] = npr_lg_bounded(st, pop - 1)
            }
        }
        return idx
    }
    if n > pop {
        stop("ValueError: Cannot take a larger sample than population when 'replace=False'")
    }
    if n < 0 {
        stop("ValueError: Negative dimensions are not allowed")
    }
    if has_p == 1 {
        py_npr_nonzero_check(p, n)
        st = py_npr_st()
        q = p * 1.0
        found = zeros(n)
        m = 0
        while m < n {
            x = zeros(n - m)
            for i to len(x) {
                x[i] = npr_mt_double(st)
            }
            m = py_npr_unique_round(q, found, m, x)
        }
        return found
    }
    perm = py_npr_perm_n(pop)
    idx = zeros(n)
    for i to n {
        idx[i] = perm[i]
    }
    return idx
}

#| np.random.choice(a) of an int a: one index; of n; of a vector a: one entry, n entries.
def py_npr_choice1(pop, replace, p: Arr, has_p) {
    idx = py_npr_choice_idx(py_npr_pop_int(pop, 1), 1, replace, p, has_p)
    return idx[0]
}

def py_npr_choice_n(pop, n, replace, p: Arr, has_p) {
    return py_npr_choice_idx(py_npr_pop_int(pop, n), n, replace, p, has_p)
}

def py_npr_choice_a1(a: Arr, replace, p: Arr, has_p) {
    idx = py_npr_choice_idx(py_npr_pop_arr(a, 1), 1, replace, p, has_p)
    return a[idx[0]]
}

def py_npr_choice_a(a: Arr, n, replace, p: Arr, has_p) {
    idx = py_npr_choice_idx(py_npr_pop_arr(a, n), n, replace, p, has_p)
    out = zeros(len(idx))
    for i to len(idx) {
        out[i] = a[idx[i]]
    }
    return out
}
'''

