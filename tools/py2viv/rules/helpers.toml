[helper.py_npr_randint]
group = "nprandom"
deps = ["py_npr_st", "py_size"]
viv = '''
#| np.random.randint(low, high): low + a masked draw in [0, high - 1 - low]. NumPy returns an
#| empty array for an empty size before it checks the bounds, and checks them before a
#| negative size; the messages are its format_bounds_error's.
def py_npr_irange(low, high) {
    hi = high - 1
    if low > hi {
        if low == 0 {
            stop("ValueError: high <= 0")
        }
        stop("ValueError: low >= high")
    }
    r = hi - low
    if r >= NPR_TWO53 {
        stop("py2viv: a random int range of 2^53 or more; a double holds the ints exactly only below it")
    }
    return r
}

def py_npr_randint(low, high) {
    r = py_npr_irange(low, high)
    return low + npr_lg_bounded(py_npr_st(), r)
}

def py_npr_randint_v(low, high, n) {
    if n == 0 {
        return zeros(0)
    }
    r = py_npr_irange(low, high)
    a = zeros(py_size(n))
    st = py_npr_st()
    for i to n {
        a[i] = low + npr_lg_bounded(st, r)
    }
    return a
}

def py_npr_randint_m(low, high, rows, cols) {
    if rows * cols == 0 {
        return zeros(py_size(rows), py_size(cols))
    }
    r = py_npr_irange(low, high)
    A = zeros(py_size(rows), py_size(cols))
    st = py_npr_st()
    for i to rows {
        for j to cols {
            A[i, j] = low + npr_lg_bounded(st, r)
        }
    }
    return A
}
'''

