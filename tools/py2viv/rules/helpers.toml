[helper.py_listeq]
group = "lists"
deps = ["py_iota"]
viv = '''
#| a == b of two Python lists (of numbers, or of rows): the same length and each item equal.
#| Python compares items by identity first, so a NaN in both at one place is equal only when it is
#| the same object, which Viv cannot tell: the run stops.
def py_listeq(a: Arr, b: Arr) {
    if len(a) != len(b) {
        return false
    }
    if len(a) == 0 {
        return true
    }
    if numel(a) != numel(b) {
        return false
    }
    fa = take(a, py_iota(numel(a)))
    fb = take(b, py_iota(numel(b)))
    same = true
    for i to len(fa) {
        if fa[i] != fb[i] {
            if fa[i] != fa[i] and fb[i] != fb[i] {
                stop("py2viv: comparing lists that hold a NaN at one place (Python compares the objects first)")
            }
            same = false
        }
    }
    return same
}
'''

