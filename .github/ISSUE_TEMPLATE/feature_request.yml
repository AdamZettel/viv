name: Feature request
description: Something Viv cannot do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check `viv features --search <words>` and KNOWN_LIMITATIONS.md first; the feature may exist under another name, or be listed already.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to compute or build, and what stops you.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: The code you want to write
      description: A small example of the program as you would like it to read.
      render: viv
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How other languages do it
      description: Optional. Python, NumPy, Julia or another language's version, if one exists.
