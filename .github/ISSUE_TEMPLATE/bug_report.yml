name: Bug report
description: A program that gives a wrong answer, crashes, is refused when it should not be, or prints different output in different engines.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest program that shows the problem. Paste it whole.
      render: viv
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected it to print or do, and why (a reference value, Python's output, the documentation).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What it printed, including any error message, exactly as shown.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: engines
    attributes:
      label: Engines affected
      description: Run it in each engine you can (`viv run f.viv`; `viv f.viv -o f.c` then `cc f.c -lm`; `viv f.viv -o f.wasm` then `node tools/run-wasm.mjs f.wasm`).
      options:
        - label: interpreter (`viv run`)
        - label: C (`viv f.viv -o f.c`)
        - label: wasm (`viv f.viv -o f.wasm`)
        - label: fast mode (`viv run --fast` or `viv build --fast`)
        - label: the browser (viv-lang.org)
        - label: the engines disagree with each other
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from (`git rev-parse --short HEAD`), your OS, and your C compiler (`cc --version`).
    validations:
      required: true
