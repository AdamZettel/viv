name: Friction report
description: Something that works but is awkward to write in Viv.
labels: [friction]
body:
  - type: markdown
    attributes:
      value: |
        A friction report records a place where Viv makes you write around a missing
        feature. The reports are counted by code, and the counts decide what the
        language adds next. CONTRIBUTING.md lists the codes.
  - type: textarea
    id: intended
    attributes:
      label: What you wanted to write
      description: The code in Python (or another language), or the Viv you tried first and that was refused.
      render: python
    validations:
      required: true
  - type: textarea
    id: written
    attributes:
      label: What you had to write
      description: The Viv that works.
      render: viv
    validations:
      required: true
  - type: dropdown
    id: code
    attributes:
      label: Code
      options:
        - no-set
        - no-tuple-key
        - no-map-literal
        - map-of-collections
        - double-sort
        - float-as-int
        - manual-string-building
        - no-generator
        - no-exception
        - flat-record
        - no-ragged
        - index-arithmetic
        - extra-copy
        - missing-builtin
        - manual-numeric-type
        - no-closure-state
        - loop-not-comprehension
        - syntax-gap
        - other
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: Note
      description: For `other`, name the contortion in a short phrase. Otherwise anything that helps (the cost in lines or time).
