name: export

# DRAFT for release 0.0.1. Every exported program
# and kernel collection built with one `cc` line on Linux and macOS, its tests
# run through Python, and its results held to the hashes the interpreter
# recorded. tools/export_ci.sh does the
# work; EXPORT_CI_STRICT makes a binary without the verb, or one that cannot
# read a kernel manifest, a failure rather than a skip.
#
# The repository has no remote yet; like gate.yml, this file is ready for
# when it has one. It does not deploy or publish anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs read the repository and upload artifacts, and
# write nothing back to GitHub.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  export:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86-64, GCC: the compiler that contracts by default
            cc: gcc
          - os: ubuntu-24.04-arm     # aarch64, GCC: has a fused multiply-add
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-14             # arm64, Apple clang
            cc: cc
    env:
      CC: ${{ matrix.cc }}
      EXPORT_CI_STRICT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # NumPy 1.24.4: lib/nprandom reproduces that version's draws.
      # SciPy and mpmath are the references K1 is checked against.
      - run: pip install numpy==1.24.4 scipy==1.12.0 mpmath==1.3.0 pytest hypothesis
      - run: cargo build --release -p viv
      - name: export, build, test, compare hashes
        run: tools/export_ci.sh
      # K1 also runs without export: the adapters in the interpreter and as
      # native C, and the C output byte for byte against the interpreter's
      - name: K1 against its references (native backend)
        run: |
          VIV=target/release/viv K1_BACKEND=native python3 kernels/k1/test_k1.py
          VIV=target/release/viv K1_BACKEND=native python3 kernels/k1/test_k1.py --engine c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-${{ matrix.os }}-${{ matrix.cc }}
          path: target/export_ci
          retention-days: 14
