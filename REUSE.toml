#
# Licensing of the files that cannot carry a comment header (data, images,
# fonts, wasm, expected outputs), of generated files, and of code copied from
# other projects. LICENSING.md explains the scheme; tools/licenses/check.py
# checks it (`tools/gate.sh premerge` runs it as `licenses`).
#
# Later annotations win over earlier ones. "closest" lets a header inside the
# file win; "override" applies even when the file has one.
version = 1

# Everything else: Viv's own license.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Viv authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

